  const s = el.getAttribute('style') || '';
  const grab = (k) => { const m = s.match(new RegExp(k + '\\s*:\\s*([^;]+)')); return m ? m[1].trim() : null; };
  const f = grab('fill'); if (f) st.fill = f;
  const sk = grab('stroke'); if (sk) st.stroke = sk;
  const sw = grab('stroke-width'); if (sw) st.strokeWidth = parseFloat(sw) || 1;
  const op = grab('opacity'); if (op) st.opacity = parseFloat(op) || 1;
  if (st.fill && st.fill.startsWith('url(')) st.fill = 'none';
  if (st.stroke && st.stroke.startsWith('url(')) st.stroke = 'none';
  return st;
}
function parseTransform(str) {
  let m = { a: 1, b: 0, c: 0, d: 1, e: 0, f: 0 };
  if (!str) return m;
  const re = /(matrix|translate|scale|rotate|skewX|skewY)\s*\(([^)]*)\)/g;
  let mt;
  while ((mt = re.exec(str))) {
    const args = mt[2].split(/[\s,]+/).map(Number).filter(n => !isNaN(n));
    let n;
    switch (mt[1]) {
      case 'matrix': n = { a: args[0], b: args[1], c: args[2], d: args[3], e: args[4], f: args[5] }; break;
      case 'translate': n = { a: 1, b: 0, c: 0, d: 1, e: args[0] || 0, f: args[1] || 0 }; break;
      case 'scale': n = { a: args[0] || 1, b: 0, c: 0, d: args[1] != null ? args[1] : (args[0] || 1), e: 0, f: 0 }; break;
      case 'rotate': {
        const a = (args[0] || 0) * Math.PI / 180, cos = Math.cos(a), sin = Math.sin(a);
        const cx = args[1] || 0, cy = args[2] || 0;
        n = { a: cos, b: sin, c: -sin, d: cos, e: cx - cos * cx + sin * cy, f: cy - sin * cx - cos * cy };
        break;
      }
      case 'skewX': { const a = (args[0] || 0) * Math.PI / 180; n = { a: 1, b: 0, c: Math.tan(a), d: 1, e: 0, f: 0 }; break; }
      case 'skewY': { const a = (args[0] || 0) * Math.PI / 180; n = { a: 1, b: Math.tan(a), c: 0, d: 1, e: 0, f: 0 }; break; }
      default: n = m;
    }
    m = multiplyMat(m, n);
  }
  return m;
}
function multiplyMat(m1, m2) {
  return {
    a: m1.a * m2.a + m1.c * m2.b,
    b: m1.b * m2.a + m1.d * m2.b,
    c: m1.a * m2.c + m1.c * m2.d,
    d: m1.b * m2.c + m1.d * m2.d,
    e: m1.a * m2.e + m1.c * m2.f + m1.e,
    f: m1.b * m2.e + m1.d * m2.f + m1.f
  };
}
function applyMatrixToSubs(subs, m) {
  const ap = (x, y) => [m.a * x + m.c * y + m.e, m.b * x + m.d * y + m.f];
  for (const sp of subs) for (const n of sp.nodes) {
    let p;
    p = ap(n.x, n.y); n.x = p[0]; n.y = p[1];
    p = ap(n.inX, n.inY); n.inX = p[0]; n.inY = p[1];
    p = ap(n.outX, n.outY); n.outX = p[0]; n.outY = p[1];
  }
}

/* ============================ 20. クリップボード ============================ */
async function copyToClipboard(format) {
  const objs = selectedObjects();
  const svg = buildSVGString({ selection: objs.length > 0 });

  if (format === 'ppt' || format === 'svg') {
    try {
      const items = {
        'text/html': new Blob([`<html><body><!--StartFragment-->${svg}<!--EndFragment--></body></html>`], { type: 'text/html' }),
        'text/plain': new Blob([svg], { type: 'text/plain' })
      };
      // SVG MIME も可能なら付ける
      try {
        if (window.ClipboardItem && ClipboardItem.supports && ClipboardItem.supports('image/svg+xml')) {
          items['image/svg+xml'] = new Blob([svg], { type: 'image/svg+xml' });
        }
      } catch (e) { /* 未対応ブラウザ */ }
      await navigator.clipboard.write([new ClipboardItem(items)]);
      if (format === 'ppt') {
        toast('クリップボードへコピーしました。<br>' +
          'PowerPointで <b>Ctrl+V</b> → 貼り付いた図を右クリック → <b>「図形に変換」</b> → <b>「頂点の編集」</b> が使えます。<br>' +
          'うまく図形にならない場合は「SVG出力」でファイル保存し、PowerPointの「挿入 → 図 → このデバイス」から読み込んでください（最も確実です）。', 7000);
      } else {
        toast('SVGとしてコピーしました');
      }
      return true;
    } catch (err) {
      // フォールバック: ファイルダウンロード
      download('vectorforge.svg', svg, 'image/svg+xml');
      toast('ブラウザのクリップボードAPIが使えないため、SVGファイルをダウンロードしました。<br>' +
        'PowerPoint: 「挿入」→「図」→「このデバイス」で読み込み → 右クリック →「図形に変換」→「頂点の編集」。', 8000);
      return false;
    }
  }

  if (format === 'png') {
    try {
      const blob = await svgToPngBlob(svg);
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      toast('PNGとしてコピーしました（ベクターではありません）');
      return true;
    } catch (e) {
      toast('PNGコピーに失敗しました: ' + e.message);
      return false;
    }
  }
  if (format === 'text') {
    try {
      await navigator.clipboard.writeText(svg);
      toast('SVGソースをテキストとしてコピーしました');
    } catch (e) {
      toast('コピーに失敗: ' + e.message);
    }
  }
}
function svgToPngBlob(svgStr, scale = 2) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    img.onload = () => {
      const c = document.createElement('canvas');
      const w = img.naturalWidth || 800, h = img.naturalHeight || 600;
      c.width = Math.max(1, Math.round(w * scale));
      c.height = Math.max(1, Math.round(h * scale));
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error('PNG生成失敗')), 'image/png');
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('SVG画像化失敗')); };
    img.src = url;
  });
}
function copySelection(fmt, cut) {
  const objs = selectedObjects();
  if (!objs.length) { toast('オブジェクトを選択してください'); return; }
  state.clipboard = objs.map(o => clone(o));
  if (cut) { deleteSelection(); toast('切り取りました'); }
  else toast('コピーしました（Ctrl+V で貼り付け）');
}
function pasteClipboard() {
  if (!state.clipboard || !state.clipboard.length) { toast('内部クリップボードが空です'); return; }
  const newIds = [];
  for (const o of state.clipboard) {
    const c = clone(o);
    reassignIds(c);
    translateObj(c, 14, 14);
    state.doc.objects.push(c);
    newIds.push(c.id);
  }
  state.sel.objs = newIds;
  commit('貼り付け');
  renderAll();
}

/* --- システムクリップボードからの貼り付け --- */
window.addEventListener('paste', async (e) => {
  // 入力欄への貼り付けは無視
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;

  // ファイル
  if (e.clipboardData && e.clipboardData.files && e.clipboardData.files.length) {
    handleFiles(e.clipboardData.files);
    return;
  }
  if (!e.clipboardData) return;
  const html = e.clipboardData.getData('text/html');
  const text = e.clipboardData.getData('text/plain');

  // SVGを含むHTML / テキスト
  const tryImport = (str) => {
    if (!str) return false;
    const m = str.match(/<svg[\s\S]*?<\/svg>/i);
    if (m) {
      const r = importSVGString(m[0]);
      return !!r;
    }
    return false;
  };
  if (tryImport(html)) return;
  if (tryImport(text)) return;

  // 内部クリップボード
  if (text && /<svg/i.test(text)) { if (tryImport(text)) return; }
  if (state.clipboard && state.clipboard.length) {
    pasteClipboard();
    return;
  }
  toast('貼り付けできるベクターデータが見つかりませんでした。<br>' +
    'PowerPointからの貼り付けは、PowerPoint側で図形をコピーしても<br>' +
    'ブラウザにはSVGとして渡されないことがあります（PNGに変換されるため）。<br>' +
    'その場合は「SVG出力」→ PowerPoint で「図形に変換」したものを再度コピーするか、<br>' +
    'SVGファイルを直接ドロップしてください。', 8000);
});

function handleFiles(files) {
  for (const f of files) {
    if (f.type.startsWith('image/svg') || f.name.toLowerCase().endsWith('.svg')) {
      const r = new FileReader();
      r.onload = () => importSVGString(r.result);
      r.readAsText(f);
    } else if (f.type.startsWith('image/')) {
      const r = new FileReader();
      r.onload = () => placeImage(r.result, f.name);
      r.readAsDataURL(f);
    } else if (f.name.toLowerCase().endsWith('.vproj') || f.type === 'application/json') {
      const r = new FileReader();
      r.onload = () => loadProject(r.result);
      r.readAsText(f);
    }
  }
}
function placeImage(dataUrl, name) {
  const img = new Image();
  img.onload = () => {
    const maxW = 600;
    const s = Math.min(1, maxW / img.width);
    const o = {
      id: uid('i'), type: 'image', name: name || '下書き画像',
      href: dataUrl, x: 0, y: 0,
      w: img.width * s, h: img.height * s,
      rotation: 0, opacity: 0.5, visible: true, locked: false
    };
    // 既存内容の後ろ（最背面）へ
    state.doc.objects.unshift(o);
    state.sel.objs = [o.id];
    commit('画像配置');
    renderAll();
    toast('画像を配置しました（最背面・半透明）。右パネルでロック/透明度を調整できます。');
  };
  img.src = dataUrl;
}

/* ============================ 21. プロジェクト保存 / 自動保存 ============================ */
const DB_NAME = 'vectorforge';
const STORE = 'projects';
let dbPromise = null;
function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve) => {
    try {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  });
  return dbPromise;
}
async function idbSet(key, val) {
  const db = await openDB();
  if (!db) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} return; }
  try {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(val, key);
  } catch (e) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e2) {} }
}
async function idbGet(key) {
  const db = await openDB();
  if (!db) { try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  return new Promise((resolve) => {
    try {
      const tx = db.transaction(STORE, 'readonly');
      const r = tx.objectStore(STORE).get(key);
      r.onsuccess = () => resolve(r.result || null);
      r.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  });
}
function scheduleSave() {
  clearTimeout(state._saveTimer);
  state._saveTimer = setTimeout(() => { saveProject('autosave'); }, 900);
}
async function saveProject(key = 'autosave') {
  const data = {
    version: 1,
    savedAt: new Date().toISOString(),
    doc: {
      objects: state.doc.objects,
      guides: state.doc.guides,
      settings: state.doc.settings,
      view: state.doc.view
    },
    historyIdx: state.history.idx
  };
  await idbSet(key, data);
  if (key === 'autosave') status('自動保存しました ' + new Date().toLocaleTimeString());
}
async function restoreAutosave() {
  const d = await idbGet('autosave');
  if (d && d.doc && d.doc.objects && d.doc.objects.length) {
    state.doc.objects = d.doc.objects;
    state.doc.guides = d.doc.guides || { h: [], v: [] };
    Object.assign(state.doc.settings, d.doc.settings || {});
    if (d.doc.view) state.doc.view = d.doc.view;
    return true;
  }
  return false;
}
function newProject() {
  if (!confirm('新規作成します。現在の内容は失われます（自動保存は上書きされます）。よろしいですか？')) return;
  state.doc.objects = [];

}
function backupProject() {
  const data = {
    format: 'VectorForge Project',
    version: 1,
    savedAt: new Date().toISOString(),
    doc: {
      objects: state.doc.objects,
      guides: state.doc.guides,

}
function loadProject(text) {
  try {
    const d = JSON.parse(text);
    if (!d.doc || !Array.isArray(d.doc.objects)) throw new Error('形式が不正です');
    state.doc.objects = d.doc.objects;
    state.doc.guides = d.doc.guides || { h: [], v: [] };
    Object.assign(state.doc.settings, d.doc.settings || {});
    if (d.doc.view) state.doc.view = d.doc.view;
    state.sel = { objs: [], nodes: [] };
    state.history.stack = []; state.history.idx = -1;
    commit('プロジェクト読込');
    renderAll(); applyView();
    toast('プロジェクトを読み込みました');

  }
}

/* ============================ 22. 基本図形の作成 ============================ */
function createShapeByDrag(type, startW, endW, opts = {}) {
  const x = Math.min(startW.x, endW.x), y = Math.min(startW.y, endW.y);
  const w = Math.abs(endW.x - startW.x), h = Math.abs(endW.y - startW.y);
  if (w < 1 && h < 1) return null;
  let obj = null;
  if (type === 'rect') {
    obj = { id: uid('p'), type: 'path', name: '長方形', subpaths: [rectSub(x, y, w, h)],
      fill: currentStyle.fill, stroke: currentStyle.stroke, strokeWidth: currentStyle.strokeWidth,
      opacity: 1, visible: true, locked: false };
  } else if (type === 'ellipse') {
    obj = { id: uid('p'), type: 'path', name: '楕円', subpaths: [ellipseSub(x + w / 2, y + h / 2, w / 2, h / 2)],
      fill: currentStyle.fill, stroke: currentStyle.stroke, strokeWidth: currentStyle.strokeWidth,
      opacity: 1, visible: true, locked: false };
  } else if (type === 'line') {
    obj = { id: uid('p'), type: 'path', name: '直線',
      subpaths: [{ closed: false, nodes: [mkNode(startW.x, startW.y), mkNode(endW.x, endW.y)] }],
      fill: 'none', stroke: currentStyle.stroke === 'none' ? '#e8ebf0' : currentStyle.stroke,
      strokeWidth: currentStyle.strokeWidth || 1, opacity: 1, visible: true, locked: false };
  } else if (type === 'polygon') {
    const sides = clamp(parseInt($('#polySides').value) || 6, 3, 60);
    const cx = x + w / 2, cy = y + h / 2, rx = w / 2, ry = h / 2;
    const nodes = [];
    for (let i = 0; i < sides; i++) {
      const a = -Math.PI / 2 + i * 2 * Math.PI / sides;
      nodes.push(mkNode(cx + Math.cos(a) * rx, cy + Math.sin(a) * ry));
    }
    obj = { id: uid('p'), type: 'path', name: sides + '角形', subpaths: [{ closed: true, nodes }],
      fill: currentStyle.fill, stroke: currentStyle.stroke, strokeWidth: currentStyle.strokeWidth,
      opacity: 1, visible: true, locked: false };
  }
  if (obj) {
    state.doc.objects.push(obj);
    state.sel.objs = [obj.id];
  }
  return obj;
}

  if (state.drag) return;
  const w = toWorld(e.clientX, e.clientY);
  const tol = 5 / state.doc.view.scale;
  for (let i = 0; i < state.doc.guides.h.length; i++) {
    if (Math.abs(w.y - state.doc.guides.h[i]) < tol && e.altKey) {
      state.drag = { mode: 'moveGuide', axis: 'h', index: i, moved: false };
      return;
    }
  }
  for (let i = 0; i < state.doc.guides.v.length; i++) {
    if (Math.abs(w.x - state.doc.guides.v[i]) < tol && e.altKey) {
      state.drag = { mode: 'moveGuide', axis: 'v', index: i, moved: false };
      return;
    }
  }

  $('#btnDel2').onclick = deleteSelection;

  // パス操作
  $('#btnJoin').onclick = joinPaths;
  $('#btnSplit').onclick = splitPathAtNodes;
  $('#btnClose').onclick = () => closeOpenPath(true);
  $('#btnOpenP').onclick = () => closeOpenPath(false);
  $('#btnReverse').onclick = reversePath;
  $('#btnSmartDel').onclick = smartDelete;
  $('#btnToLine').onclick = () => setNodeType('line');
  $('#btnToCurve').onclick = toCurve;
  $('#btnCorner').onclick = () => setNodeType('corner');
  $('#btnSmooth').onclick = () => setNodeType('smooth');
  $('#btnSym').onclick = () => setNodeType('symmetric');
  $('#btnSmoothPath').onclick = () => smoothPathAll(0.5);

  // 簡略化
  const simpTol = $('#simpTol');
  const updateSimpLabel = () => {
    const t = 0.1 + Math.pow(parseInt(simpTol.value) / 100, 2) * 40;
    $('#simpVal').textContent = t.toFixed(1);
    const objs = selectedObjects().filter(o => o.type === 'path');
    if (objs.length) {
      let n = 0;
      objs.forEach(o => o.subpaths.forEach(sp => n += sp.nodes.length));
      $('#simpCount').textContent = '現在 ' + n + ' 頂点';
    } else $('#simpCount').textContent = '-';
    return t;
  };
  simpTol.oninput = updateSimpLabel;
  $('#btnSimplify').onclick = () => simplifyPath(updateSimpLabel());
  $('#btnSmoothAll').onclick = () => smoothPathAll(0.6);
  $('#btnOffsetOut').onclick = () => offsetSelected(Math.abs(parseFloat($('#offsetDist').value) || 5), $('#offsetJoin').value);
  $('#btnOffsetIn').onclick = () => offsetSelected(-Math.abs(parseFloat($('#offsetDist').value) || 5), $('#offsetJoin').value);

  // シェイプビルダー
  $('#sbKeep').onclick = () => { state.sb.mode = 'keep'; $('#sbKeep').classList.add('on'); $('#sbMerge').classList.remove('on'); $('#sbDelete').classList.remove('on'); };
  $('#sbMerge').onclick = () => { state.sb.mode = 'merge'; $('#sbMerge').classList.add('on'); $('#sbKeep').classList.remove('on'); $('#sbDelete').classList.remove('on'); };
  $('#sbDelete').onclick = () => { state.sb.mode = 'delete'; $('#sbDelete').classList.add('on'); $('#sbKeep').classList.remove('on'); $('#sbMerge').classList.remove('on'); };
  $('#sbApply').onclick = applyShapeBuilder;

  // 表示/スナップ
  const toggleBtn = (sel, key, invert = false) => {
    const b = $(sel);
    const cur = invert ? !state.doc.settings[key] : state.doc.settings[key];
    b.classList.toggle('on', cur);
    b.onclick = () => {
      state.doc.settings[key] = !state.doc.settings[key];
      b.classList.toggle('on', state.doc.settings[key]);
      applyView(); renderOverlay(); scheduleSave();
    };
  };
  toggleBtn('#tgGrid', 'gridVisible');
  toggleBtn('#tgGuides', 'guidesVisible');
  toggleBtn('#tgSnapGrid', 'snapGrid');
  toggleBtn('#tgSnapGuide', 'snapGuide');
  toggleBtn('#tgSnapObj', 'snapObj');
  toggleBtn('#tgSnapAnchor', 'snapAnchor');

  $('#gridSize').onchange = (e) => { state.doc.settings.gridSize = clamp(parseInt(e.target.value) || 20, 1, 500); applyView(); };
  $('#btnAddGuideH').onclick = () => addGuide('h', 0);
  $('#btnAddGuideV').onclick = () => addGuide('v', 0);
  $('#btnClearGuides').onclick = () => { state.doc.guides = { h: [], v: [] }; renderOverlay(); commit('ガイド消去'); };
  $('#btnPlaceImage').onclick = () => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => placeImage(r.result, f.name);
      r.readAsDataURL(f);
    };
    inp.click();
  };

  // 下書き画像操作
  $('#btnImgVisible').onclick = () => toggleImgProp('visible');
  $('#btnImgLock').onclick = () => toggleImgProp('locked');
  $('#btnImgOpacity').onclick = () => adjustImgOpacity(-0.15);
  $('#btnImgOpacityUp').onclick = () => adjustImgOpacity(0.15);
  $('#btnImgBack').onclick = () => {
    const objs = selectedObjects().filter(o => o.type === 'image');
    objs.forEach(o => {
      const p = findParentList(o.id);
      if (!p) return;
      p.list.splice(p.index, 1);
      p.list.unshift(o);
    });
    commit('最背面へ');
    renderAll();
  };

  // レイヤー
  $('#btnAddFolder').onclick = () => {
    const g = { id: uid('g'), type: 'group', name: 'フォルダ ' + (state.doc.objects.length + 1),
      children: [], visible: true, locked: false, opacity: 1 };
    state.doc.objects.push(g);
    state.sel.objs = [g.id];
    commit('フォルダ作成');
    renderAll();
  };
  $('#btnVisAll').onclick = () => {
    const walk = (l) => l.forEach(o => { o.visible = true; if (o.type === 'group') walk(o.children); });
    walk(state.doc.objects);
    commit('全表示'); renderAll();
  };

  // プロパティ適用
  $('#btnApplyXY').onclick = () => {
    const objs = selectedObjects(); if (!objs.length) return;
    const bb = objsBBox(objs);
    const nx = parseFloat($('#pX').value), ny = parseFloat($('#pY').value);
    if (isNaN(nx) || isNaN(ny)) return;
    objs.forEach(o => translateObj(o, nx - bb.x, ny - bb.y));
    commit('座標適用'); renderAll();
  };
  $('#btnApplyWH').onclick = () => {
    const objs = selectedObjects(); if (!objs.length) return;
    const bb = objsBBox(objs);
    const nw = parseFloat($('#pW').value), nh = parseFloat($('#pH').value);
    if (isNaN(nw) || isNaN(nh) || nw <= 0 || nh <= 0) return;
    objs.forEach(o => setObjBBox(o, bb.x, bb.y, nw, nh));
    commit('サイズ適用'); renderAll();
  };
  $('#btnApplyR').onclick = () => {
    const objs = selectedObjects(); if (!objs.length) return;
    const r = parseFloat($('#pR').value);
    if (isNaN(r)) return;
    const bb = objsBBox(objs);
    objs.forEach(o => rotateObj(o, bb.x + bb.w / 2, bb.y + bb.h / 2, r));
    $('#pR').value = 0;
    commit('回転適用'); renderAll();
  };
  $('#btnApplyAnchor').onclick = () => {
    if (!state.sel.nodes.length) return;
    const nx = parseFloat($('#aX').value), ny = parseFloat($('#aY').value);
    if (isNaN(nx) && isNaN(ny)) return;
    for (const s of state.sel.nodes) {
      const o = findObj(s.objId);
      const n = o && o.subpaths[s.sp] && o.subpaths[s.sp].nodes[s.idx];
      if (!n) continue;
      const dx = isNaN(nx) ? 0 : nx - n.x;
      const dy = isNaN(ny) ? 0 : ny - n.y;
      n.x += dx; n.y += dy; n.inX += dx; n.inY += dy; n.outX += dx; n.outY += dy;
    }
    new Set(state.sel.nodes.map(s => s.objId)).forEach(id => refreshObjGeometry(findObj(id)));
    commit('アンカー座標適用'); renderAll();
  };
  $('#btnApplyH').onclick = () => {
    if (!state.sel.nodes.length) return;
    const ang = (parseFloat($('#aAng').value) || 0) * Math.PI / 180;
    const len = parseFloat($('#aLen').value);
    for (const s of state.sel.nodes) {
      const o = findObj(s.objId);
      const n = o && o.subpaths[s.sp] && o.subpaths[s.sp].nodes[s.idx];
      if (!n) continue;
      const l = isNaN(len) ? Math.hypot(n.outX - n.x, n.outY - n.y) : len;
      n.outX = n.x + Math.cos(ang) * l;
      n.outY = n.y + Math.sin(ang) * l;
      if (n.t !== 'corner') {
        n.inX = n.x - Math.cos(ang) * l;
        n.inY = n.y - Math.sin(ang) * l;
      }
    }
    new Set(state.sel.nodes.map(s => s.objId)).forEach(id => refreshObjGeometry(findObj(id)));
    commit('ハンドル角度適用'); renderAll();
  };
  $('#btnMirrorH').onclick = () => setNodeType('symmetric');
  $('#btnBreakH').onclick = () => {
    for (const s of state.sel.nodes) {
      const o = findObj(s.objId);
      const n = o && o.subpaths[s.sp] && o.subpaths[s.sp].nodes[s.idx];
      if (n) n.t = 'corner';
    }
    commit('ハンドル独立'); renderAll();
  };

  // モバイル
  $('#mLeft').onclick = () => {
    $('#leftPanel').classList.toggle('open');
    $('#rightPanel').classList.remove('open');
    $('#scrim').classList.toggle('show', $('#leftPanel').classList.contains('open'));
  };
  $('#mRight').onclick = () => {
    $('#rightPanel').classList.toggle('open');
    $('#leftPanel').classList.remove('open');
    $('#scrim').classList.toggle('show', $('#rightPanel').classList.contains('open'));
  };
  $('#scrim').onclick = () => {
    $('#leftPanel').classList.remove('open');
    $('#rightPanel').classList.remove('open');
    $('#scrim').classList.remove('show');
  };

  window.addEventListener('resize', () => { drawRulers(); });
}

/* ============================ 27. 初期化 ============================ */
async function init() {
  bindUI();
  const restored = await restoreAutosave();
  if (!restored) {
    // 初期サンプル
    const s1 = { id: uid('p'), type: 'path', name: 'サンプル長方形',
      subpaths: [rectSub(60, 60, 200, 130)],
      fill: '#4a9eff', stroke: 'none', strokeWidth: 0, opacity: 1, visible: true, locked: false };
    const s2 = { id: uid('p'), type: 'path', name: 'サンプル楕円',
      subpaths: [ellipseSub(360, 160, 110, 80)],
      fill: '#e5534b', stroke: 'none', strokeWidth: 0, opacity: 1, visible: true, locked: false };
    state.doc.objects.push(s1, s2);
  }
  commit('初期化');
  renderAll();
  requestAnimationFrame(() => { if (!restored) zoomFit(); else applyView(); });

  // ビューポート初期化
  if (!restored) {
    state.doc.view = { tx: 80, ty: 80, scale: 1 };
    applyView();
  }
  updateHistoryButtons();
  status(restored ? '自動保存から復元しました' : '準備完了');
}

/* ---- createShape のドラッグ処理を onPointerMove に統合 ---- */
(function patchMove() {
  const orig = onPointerMove;
  window.__vf_move = orig;
})();

/* 図形作成モードの pointermove / up を追加ハンドラで処理 */
svgEl.addEventListener('pointermove', (e) => {
  const d = state.drag;
  if (!d || d.mode !== 'createShape') return;
  const w = toWorld(e.clientX, e.clientY);
  const snap = applySnap(w, null);
  d.cur = snap;
  renderOverlay();
  // プレビュー
  const x = Math.min(d.start.x, snap.x), y = Math.min(d.start.y, snap.y);
  const ww = Math.abs(snap.x - d.start.x), hh = Math.abs(snap.y - d.start.y);
  let previewEl = $('#shapePreview');
  if (!previewEl) {
    previewEl = document.createElementNS(NS, 'rect');
    previewEl.id = 'shapePreview';
    previewEl.setAttribute('fill', '#4a9eff22');
    previewEl.setAttribute('stroke', '#4a9eff');
    previewEl.setAttribute('stroke-width', 1);
    previewEl.setAttribute('vector-effect', 'non-scaling-stroke');
    previewEl.setAttribute('pointer-events', 'none');
    overlayRoot.appendChild(previewEl);
  }
  if (d.type === 'line') {
    previewEl.setAttribute('x', d.start.x); previewEl.setAttribute('y', d.start.y);
    previewEl.setAttribute('width', snap.x - d.start.x);
    previewEl.setAttribute('height', 1);
  } else {
    previewEl.setAttribute('x', x); previewEl.setAttribute('y', y);
    previewEl.setAttribute('width', ww); previewEl.setAttribute('height', hh);
  }
}, true);

svgEl.addEventListener('pointerup', (e) => {
  const d = state.drag;
  if (!d || d.mode !== 'createShape') return;
  state.drag = null;
  const p = $('#shapePreview'); if (p) p.remove();
  const obj = createShapeByDrag(d.type, d.start, d.cur);
  if (obj) {
    commit('図形作成');
    setTool('select');
    renderAll();
  } else {
    renderOverlay();
  }
}, true);

/* ---- 開始 ---- */
init();
