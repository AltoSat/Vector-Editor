    for (const y of state.doc.guides.h) {
      const l = document.createElementNS(NS, 'line');
      l.setAttribute('x1', bb.x); l.setAttribute('x2', bb.x + bb.w);
      l.setAttribute('y1', y); l.setAttribute('y2', y);
      l.setAttribute('stroke', '#1e88e5'); l.setAttribute('stroke-width', 1);
      l.setAttribute('vector-effect', 'non-scaling-stroke');
      l.setAttribute('stroke-dasharray', '6 4');
      frag.appendChild(l);
    }
    for (const x of state.doc.guides.v) {
      const l = document.createElementNS(NS, 'line');
      l.setAttribute('y1', bb.y); l.setAttribute('y2', bb.y + bb.h);
      l.setAttribute('x1', x); l.setAttribute('x2', x);
      l.setAttribute('stroke', '#1e88e5'); l.setAttribute('stroke-width', 1);
      l.setAttribute('vector-effect', 'non-scaling-stroke');
      l.setAttribute('stroke-dasharray', '6 4');
      frag.appendChild(l);
    }
  }

  const selObjs = selectedObjects();

  // アンカー / ハンドル（nodeツール or アンカー選択時）
  if (state.tool === 'node' || state.sel.nodes.length > 0) {
    const targetIds = new Set();
    selObjs.forEach(o => collectLeafPaths(o).forEach(p => targetIds.add(p.id)));
    state.sel.nodes.forEach(n => targetIds.add(n.objId));
    for (const id of targetIds) {
      const obj = findObj(id);
      if (!obj || obj.type !== 'path') continue;
      if (obj.visible === false) continue;
      const selectedNodes = state.sel.nodes.filter(n => n.objId === id);
      for (let si = 0; si < obj.subpaths.length; si++) {
        const sp = obj.subpaths[si];
        for (let ni = 0; ni < sp.nodes.length; ni++) {
          const n = sp.nodes[ni];
          const isSel = selectedNodes.some(s => s.sp === si && s.idx === ni);
          // ハンドル
          if (st.showHandles && (isSel || (state.tool === 'node' && selectedNodes.length === 0))) {
            const hasOut = !(n.outX === n.x && n.outY === n.y);
            const hasIn = !(n.inX === n.x && n.inY === n.y);
            if (hasOut) frag.appendChild(ovLine(n.x, n.y, n.outX, n.outY, '#4a9eff'));
            if (hasIn) frag.appendChild(ovLine(n.x, n.y, n.inX, n.inY, '#4a9eff'));
            if (hasOut) frag.appendChild(ovCircle(n.outX, n.outY, 3.6, '#141619', '#4a9eff'));
            if (hasIn) frag.appendChild(ovCircle(n.inX, n.inY, 3.6, '#141619', '#4a9eff'));
          }
          // アンカー
          if (st.showAnchors) {
            const c = isSel ? '#ffb300' : '#e8ebf0';
            const stroke = isSel ? '#ff8f00' : '#4a9eff';
            const r = n.t === 'corner' ? 3.6 : 4.2;
            frag.appendChild(ovCircle(n.x, n.y, r, c, stroke, isSel ? 1.6 : 1.2));
          }
        }
      }
    }
  }

  // 選択枠 + 変形ハンドル
  if (selObjs.length && state.tool !== 'node') {
    const bb = objsBBox(selObjs);
    if (bb) {
      frag.appendChild(ovRect(bb.x, bb.y, bb.w, bb.h, 'none', '#4a9eff', 1, 1.5));
      if (state.tool === 'select') {
        const hs = handlePositions(bb);
        for (const h of hs) {
          frag.appendChild(ovRect(h.x - 3.5, h.y - 3.5, 7, 7, '#e8ebf0', '#2d6fbf', 1.2, 1));
        }
        // 回転ハンドル
        const rp = { x: bb.x + bb.w / 2, y: bb.y - 22 / state.doc.view.scale };
        frag.appendChild(ovLine(bb.x + bb.w / 2, bb.y, rp.x, rp.y, '#4a9eff'));
        frag.appendChild(ovCircle(rp.x, rp.y, 5, '#e8ebf0', '#2d6fbf', 1.2));
      }
    }
    // 各オブジェクトの薄い枠
    for (const o of selObjs) {
      const b = objBBox(o);
      if (b) frag.appendChild(ovRect(b.x, b.y, b.w, b.h, 'none', '#4a9eff55', 1, 1, '2 3'));
    }
  }

  // ペンプレビュー
  if (state.pen && state.pen.nodes.length) {
    const sp = { closed: false, nodes: state.pen.nodes };
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', subpathD(sp));
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', '#ffb300');
    p.setAttribute('stroke-width', 1.2);
    p.setAttribute('vector-effect', 'non-scaling-stroke');
    frag.appendChild(p);
    for (const n of state.pen.nodes) {
      frag.appendChild(ovCircle(n.x, n.y, 3.5, '#ffb300', '#ff8f00', 1.2));
    }
  }

  // Shape Builder ハイライト
  if (state.sb.regions.length) {
    for (const r of state.sb.regions) {
      const d = r.pts.map((p, i) => (i ? 'L' : 'M') + rnd(p[0]) + ' ' + rnd(p[1])).join(' ') + ' Z';
      const p = document.createElementNS(NS, 'path');
      p.setAttribute('d', d);
      p.setAttribute('fill', state.sb.picked.has(r.id) ? '#4a9eff66' : '#ffffff18');
      p.setAttribute('stroke', state.sb.picked.has(r.id) ? '#4a9eff' : '#ffffff55');
      p.setAttribute('stroke-width', 1);
      p.setAttribute('vector-effect', 'non-scaling-stroke');
      frag.appendChild(p);
    }
  }

  // マーキー
  if (state.drag && state.drag.mode === 'marquee') {
    const d = state.drag;
    const x = Math.min(d.start.x, d.cur.x), y = Math.min(d.start.y, d.cur.y);
    const w = Math.abs(d.cur.x - d.start.x), h = Math.abs(d.cur.y - d.start.y);
    frag.appendChild(ovRect(x, y, w, h, '#4a9eff22', '#4a9eff', 1, 1));
  }

  overlayRoot.replaceChildren(frag);
}
function ovLine(x1, y1, x2, y2, stroke) {
  const l = document.createElementNS(NS, 'line');
  l.setAttribute('x1', x1); l.setAttribute('y1', y1);
  l.setAttribute('x2', x2); l.setAttribute('y2', y2);
  l.setAttribute('stroke', stroke); l.setAttribute('stroke-width', 1);
  l.setAttribute('vector-effect', 'non-scaling-stroke');
  return l;
}
function ovCircle(cx, cy, r, fill, stroke, sw) {
  const c = document.createElementNS(NS, 'circle');
  c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', r / state.doc.view.scale * state.doc.view.scale);
  c.setAttribute('r', r);
  c.setAttribute('fill', fill); c.setAttribute('stroke', stroke);
  c.setAttribute('stroke-width', sw || 1);
  c.setAttribute('vector-effect', 'non-scaling-stroke');
  return c;
}
function ovRect(x, y, w, h, fill, stroke, sw, op, dash) {
  const r = document.createElementNS(NS, 'rect');
  r.setAttribute('x', x); r.setAttribute('y', y);
  r.setAttribute('width', Math.max(0, w)); r.setAttribute('height', Math.max(0, h));
  r.setAttribute('fill', fill); r.setAttribute('stroke', stroke);
  r.setAttribute('stroke-width', sw || 1);
  if (dash) r.setAttribute('stroke-dasharray', dash);
  r.setAttribute('vector-effect', 'non-scaling-stroke');
  return r;
}
function handlePositions(bb) {
  return [
    { x: bb.x, y: bb.y, k: 'nw' }, { x: bb.x + bb.w / 2, y: bb.y, k: 'n' },
    { x: bb.x + bb.w, y: bb.y, k: 'ne' }, { x: bb.x + bb.w, y: bb.y + bb.h / 2, k: 'e' },
    { x: bb.x + bb.w, y: bb.y + bb.h, k: 'se' }, { x: bb.x + bb.w / 2, y: bb.y + bb.h, k: 's' },
    { x: bb.x, y: bb.y + bb.h, k: 'sw' }, { x: bb.x, y: bb.y + bb.h / 2, k: 'w' }
  ];
}
function collectLeafPaths(obj, out = []) {
  if (obj.type === 'group') obj.children.forEach(c => collectLeafPaths(c, out));
  else out.push(obj);
  return out;
}

/* ---------- 定規 ---------- */
function drawRulers() {
  if (!state.doc.settings.showRulers) return;
  const v = state.doc.view;
  const top = $('#rulerTop'), left = $('#rulerLeft');
  if (!top || !left || top.clientWidth === 0) return;
  const step = niceStep(60 / v.scale);
  let html = '';
  const w = top.clientWidth, h = left.clientHeight;
  const x0 = -v.tx / v.scale, x1 = x0 + w / v.scale;
  for (let x = Math.floor(x0 / step) * step; x < x1; x += step) {
    const sx = x * v.scale + v.tx;
    html += `<line x1="${sx}" y1="12" x2="${sx}" y2="18" stroke="#666d77"/>`;
    html += `<text x="${sx + 2}" y="10" fill="#8f96a0" font-size="9">${Math.round(x)}</text>`;
  }
  top.innerHTML = `<svg width="100%" height="100%">${html}</svg>`;

  const y0 = -v.ty / v.scale, y1 = y0 + h / v.scale;
  html = '';
  for (let y = Math.floor(y0 / step) * step; y < y1; y += step) {
    const sy = y * v.scale + v.ty;
    html += `<line x1="12" y1="${sy}" x2="18" y2="${sy}" stroke="#666d77"/>`;
    html += `<text x="1" y="${sy - 2}" fill="#8f96a0" font-size="9">${Math.round(y)}</text>`;
  }
  left.innerHTML = `<svg width="100%" height="100%">${html}</svg>`;
}
function niceStep(target) {
  const pow = Math.pow(10, Math.floor(Math.log10(target)));
  const n = target / pow;
  if (n <= 1) return pow;
  if (n <= 2) return 2 * pow;
  if (n <= 5) return 5 * pow;
  return 10 * pow;
}

/* ============================ 7. 履歴 ============================ */
function commit(label) {
  const snap = clone(state.doc.objects);
  state.history.stack = state.history.stack.slice(0, state.history.idx + 1);
  state.history.stack.push(snap);
  if (state.history.stack.length > state.history.max) state.history.stack.shift();
  state.history.idx = state.history.stack.length - 1;
  updateHistoryButtons();
  scheduleSave();
  if (label) status(label);
}
function undo() {
  if (state.history.idx <= 0) { toast('これ以上戻せません'); return; }
  state.history.idx--;
  state.doc.objects = clone(state.history.stack[state.history.idx]);
  pruneSelection();
  renderAll(); scheduleSave(); updateHistoryButtons();
  status('元に戻す');
}
function redo() {
  if (state.history.idx >= state.history.stack.length - 1) { toast('これ以上やり直せません'); return; }
  state.history.idx++;
  state.doc.objects = clone(state.history.stack[state.history.idx]);
  pruneSelection();
  renderAll(); scheduleSave(); updateHistoryButtons();
  status('やり直し');
}
function updateHistoryButtons() {
  $('#btnUndo').disabled = state.history.idx <= 0;
  $('#btnRedo').disabled = state.history.idx >= state.history.stack.length - 1;
}
function pruneSelection() {
  state.sel.objs = state.sel.objs.filter(id => findObj(id));
  state.sel.nodes = state.sel.nodes.filter(n => {
    const o = findObj(n.objId);
    return o && o.type === 'path' && o.subpaths[n.sp] && o.subpaths[n.sp].nodes[n.idx];
  });
}

/* ============================ 8. レンダリング統合 ============================ */
function renderAll() {
  renderScene();
  renderOverlay();
  renderLayers();
  renderProps();
  updateStatusBar();
}
function updateStatusBar() {
  $('#stSel').textContent = state.sel.objs.length;
  $('#stNode').textContent = state.sel.nodes.length;
}

/* ============================ 9. 座標変換 / スナップ ============================ */
function toWorld(clientX, clientY) {
  const r = svgEl.getBoundingClientRect();
  const v = state.doc.view;
  return { x: (clientX - r.left - v.tx) / v.scale, y: (clientY - r.top - v.ty) / v.scale };
}
function zoomAt(clientX, clientY, factor) {
  const r = svgEl.getBoundingClientRect();
  const px = clientX - r.left, py = clientY - r.top;
  const v = state.doc.view;
  const ns = clamp(v.scale * factor, 0.02, 80);
  v.tx = px - (px - v.tx) * (ns / v.scale);
  v.ty = py - (py - v.ty) * (ns / v.scale);
  v.scale = ns;
  applyView();
}
function zoomFit() {
  const bb = docBBox();
  const r = svgEl.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const pad = 60;
  const s = Math.min((r.width - pad * 2) / Math.max(bb.w, 1), (r.height - pad * 2) / Math.max(bb.h, 1));
  const v = state.doc.view;
  v.scale = clamp(s, 0.02, 40);
  v.tx = r.width / 2 - (bb.x + bb.w / 2) * v.scale;
  v.ty = r.height / 2 - (bb.y + bb.h / 2) * v.scale;
  applyView();
}
function zoom100() {
  const r = svgEl.getBoundingClientRect();
  const v = state.doc.view;
  const cx = (r.width / 2 - v.tx) / v.scale, cy = (r.height / 2 - v.ty) / v.scale;
  v.scale = 1;
  v.tx = r.width / 2 - cx; v.ty = r.height / 2 - cy;
  applyView();
}

/** スナップ候補を収集 */
function gatherSnapTargets(excludeIds) {
  const xs = [], ys = [];
  const st = state.doc.settings;
  if (st.snapGuides !== false) {
    if (st.guidesVisible === false) { /* ガイド非表示でも吸着は有効 */ }
    state.doc.guides.v.forEach(x => xs.push(x));
    state.doc.guides.h.forEach(y => ys.push(y));
  }
  if (st.snapObj) {
    for (const o of state.doc.objects) {
      if (excludeIds && excludeIds.has(rootAncestorId(o.id))) continue;
      if (o.visible === false) continue;
      const b = objBBox(o);
      if (!b) continue;
      xs.push(b.x, b.x + b.w / 2, b.x + b.w);
      ys.push(b.y, b.y + b.h / 2, b.y + b.h);
    }
  }
  if (st.snapAnchor) {
    for (const o of state.doc.objects) {
      if (excludeIds && excludeIds.has(rootAncestorId(o.id))) continue;
      if (o.visible === false || o.type === 'group') continue;
      for (const p of collectLeafPaths(o)) {
        if (p.type !== 'path') continue;
        for (const sp of p.subpaths) for (const n of sp.nodes) { xs.push(n.x); ys.push(n.y); }
      }
    }
  }
  return { xs, ys };
}
function snapValue(val, arr, tol) {
  let best = null, bd = tol;
  for (const v of arr) {
    const d = Math.abs(v - val);
    if (d < bd) { bd = d; best = v; }
  }
  return best;
}
function applySnap(world, excludeIds) {
  const st = state.doc.settings;
  const tol = 7 / state.doc.view.scale;
  let x = world.x, y = world.y;
  if (st.snapGrid) {
    const g = st.gridSize;
    if (Math.abs(x - Math.round(x / g) * g) < tol) x = Math.round(x / g) * g;
    if (Math.abs(y - Math.round(y / g) * g) < tol) y = Math.round(y / g) * g;
  }
  const t = gatherSnapTargets(excludeIds);
  const sx = snapValue(x, t.xs, tol);
  const sy = snapValue(y, t.ys, tol);
  if (sx !== null) x = sx;
  if (sy !== null) y = sy;
  return { x, y };
}

/* ============================ 10. インタラクション ============================ */
const pointers = new Map();
let pinch = null;
let spaceDown = false;

svgEl.addEventListener('contextmenu', e => { if (state.pen) { e.preventDefault(); } });

svgEl.addEventListener('pointerdown', onPointerDown);
svgEl.addEventListener('pointermove', onPointerMove);
svgEl.addEventListener('pointerup', onPointerUp);
svgEl.addEventListener('pointercancel', onPointerUp);
svgEl.addEventListener('pointerleave', e => { /* noop */ });
svgEl.addEventListener('wheel', e => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey || Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
    const f = Math.exp(-e.deltaY * 0.0015);
    zoomAt(e.clientX, e.clientY, f);
  } else {
    state.doc.view.tx -= e.deltaX;
    state.doc.view.ty -= e.deltaY;
    applyView();
  }
}, { passive: false });

function onPointerDown(e) {
  svgEl.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size === 2) {
    // ピンチ開始
    const pts = Array.from(pointers.values());
    pinch = {
      d: dist(pts[0].x, pts[0].y, pts[1].x, pts[1].y),
      cx: (pts[0].x + pts[1].x) / 2,
      cy: (pts[0].y + pts[1].y) / 2,
      scale: state.doc.view.scale,
      tx: state.doc.view.tx, ty: state.doc.view.ty
    };
    state.drag = null;
    return;
  }
  if (pointers.size > 2) return;

  const w = toWorld(e.clientX, e.clientY);
  const isTouch = e.pointerType === 'touch';
  const hitR = (isTouch ? 16 : 8) / state.doc.view.scale;

  // 中ボタン or スペース or ハンドツール → パン
  if (e.button === 1 || spaceDown || state.tool === 'hand') {
    state.drag = { mode: 'pan', sx: e.clientX, sy: e.clientY, tx: state.doc.view.tx, ty: state.doc.view.ty };
    return;
  }
  if (e.button === 2) return;

  // ズームツール
  if (state.tool === 'zoom') {
    zoomAt(e.clientX, e.clientY, e.altKey ? 1 / 1.4 : 1.4);
    return;
  }

  // ペンツール
  if (state.tool === 'pen') {
    handlePenDown(w, e);
    return;
  }

  // Shape Builder
  if (state.tool === 'shaper') {
    const r = hitRegion(w);
    if (r) {
      if (state.sb.picked.has(r.id)) state.sb.picked.delete(r.id);
      else state.sb.picked.add(r.id);
      renderOverlay();
    }
    return;
  }

  // 頂点編集ツール
  if (state.tool === 'node') {
    if (handleNodeDown(w, e, hitR)) return;
  }

  // 選択ツール（変形ハンドル判定）
  if (state.tool === 'select') {
    if (handleTransformHandleDown(w, e, hitR)) return;
  }

  // オブジェクトヒットテスト
  const hitId = hitTestObject(e.target);

  if (hitId) {
    const rootId = rootAncestorId(hitId);
    const additive = e.shiftKey || e.ctrlKey || e.metaKey;
    if (additive) {
      if (state.sel.objs.includes(rootId)) state.sel.objs = state.sel.objs.filter(i => i !== rootId);
      else state.sel.objs.push(rootId);
    } else if (!state.sel.objs.includes(rootId)) {
      state.sel.objs = [rootId];
      state.sel.nodes = [];
    }
    // ダブルクリックでグループ進入
    if (e.detail >= 2 && hitId !== rootId) {
      state.enterGroup = [rootId];
      state.sel.objs = [hitId];
    }
    state.drag = {
      mode: 'moveObjs', start: w, cur: w,
      orig: selectedObjects().map(o => ({ id: o.id, snap: clone(o) })),
      moved: false
    };
    renderAll();
    return;
  }

  // 何もない → マーキー
  if (!e.shiftKey) { state.sel.objs = []; state.sel.nodes = []; }
  state.drag = { mode: 'marquee', start: w, cur: w, add: e.shiftKey, base: state.sel.objs.slice() };
  renderAll();
}

function hitTestObject(target) {
  let el = target;
  while (el && el !== svgEl) {
    const id = el.getAttribute && el.getAttribute('data-id');
    if (id) {
      const o = findObj(id);
      if (o && !o.locked && o.visible !== false) return id;
      if (o && o.locked) return null;
    }
    el = el.parentNode;
  }
  return null;
}

/* --- 変形ハンドル --- */
function handleTransformHandleDown(w, e, hitR) {
  const selObjs = selectedObjects();
  if (!selObjs.length) return false;
  const bb = objsBBox(selObjs);
  if (!bb) return false;
  // 回転ハンドル
  const rp = { x: bb.x + bb.w / 2, y: bb.y - 22 / state.doc.view.scale };
  if (dist(w.x, w.y, rp.x, rp.y) < hitR * 1.6) {
    state.drag = {
      mode: 'rotate', cx: bb.x + bb.w / 2, cy: bb.y + bb.h / 2,
      startAngle: Math.atan2(w.y - (bb.y + bb.h / 2), w.x - (bb.x + bb.w / 2)),
      orig: selObjs.map(o => ({ id: o.id, snap: clone(o) })),
      moved: false
    };
    return true;
  }
  for (const h of handlePositions(bb)) {
    if (dist(w.x, w.y, h.x, h.y) < hitR * 1.5) {
      state.drag = {
        mode: 'scale', handle: h.k, bb: { ...bb }, start: w,
        orig: selObjs.map(o => ({ id: o.id, snap: clone(o) })),
        moved: false
      };
      return true;
    }
  }
  return false;
}

/* --- 頂点編集 --- */
function handleNodeDown(w, e, hitR) {
  // ハンドル優先
  for (const sel of state.sel.nodes) {
    const o = findObj(sel.objId);
    if (!o || o.type !== 'path') continue;
    const n = o.subpaths[sel.sp] && o.subpaths[sel.sp].nodes[sel.idx];
    if (!n) continue;
    if (dist(w.x, w.y, n.outX, n.outY) < hitR) {
      state.drag = { mode: 'handle', objId: o.id, sp: sel.sp, idx: sel.idx, which: 'out',
        start: w, orig: clone(o), moved: false };
      return true;
    }
    if (dist(w.x, w.y, n.inX, n.inY) < hitR) {
      state.drag = { mode: 'handle', objId: o.id, sp: sel.sp, idx: sel.idx, which: 'in',
        start: w, orig: clone(o), moved: false };
      return true;
    }
  }
  // アンカー
  const allPaths = [];
  for (const o of state.doc.objects) {
    if (o.visible === false || o.locked) continue;
    collectLeafPaths(o).forEach(p => { if (p.type === 'path') allPaths.push(p); });
  }
  let best = null, bd = hitR;
  for (const p of allPaths) {
    for (let si = 0; si < p.subpaths.length; si++) {
      const sp = p.subpaths[si];
      for (let ni = 0; ni < sp.nodes.length; ni++) {
        const n = sp.nodes[ni];
        const d = dist(w.x, w.y, n.x, n.y);
        if (d < bd) { bd = d; best = { objId: p.id, sp: si, idx: ni }; }
      }
    }
  }
  if (best) {
    const additive = e.shiftKey || e.ctrlKey || e.metaKey;
    const key = `${best.objId}|${best.sp}|${best.idx}`;
    const exists = state.sel.nodes.findIndex(n => `${n.objId}|${n.sp}|${n.idx}` === key);
    if (additive) {
      if (exists >= 0) state.sel.nodes.splice(exists, 1);
      else state.sel.nodes.push(best);
    } else {
      if (exists < 0) state.sel.nodes = [best];
    }
    if (!state.sel.objs.includes(best.objId)) state.sel.objs = [best.objId];
    state.drag = {
      mode: 'moveNodes', start: w,
      orig: state.sel.nodes.map(s => ({ s, node: clone(findObj(s.objId).subpaths[s.sp].nodes[s.idx]) })),
      moved: false
    };
    renderAll();
    return true;
  }
  return false;
}

/* --- ペン --- */
function handlePenDown(w, e) {
  if (!state.pen) {
    state.pen = { nodes: [mkNode(w.x, w.y)], objId: null };
  } else {
    const first = state.pen.nodes[0];
    const hitR = 10 / state.doc.view.scale;
    if (state.pen.nodes.length > 1 && dist(w.x, w.y, first.x, first.y) < hitR) {
      // 閉じる
      finishPen(true);
      return;
    }
    state.pen.nodes.push(mkNode(w.x, w.y));
  }
  state.drag = { mode: 'penDrag', start: w, nodeIdx: state.pen.nodes.length - 1, moved: false };
  renderOverlay();
}
function finishPen(closed) {
  if (!state.pen || state.pen.nodes.length < 2) { state.pen = null; renderOverlay(); return; }
  const obj = {
    id: uid('p'), type: 'path', name: 'パス ' + nextNameNum(),
    subpaths: [{ closed: !!closed, nodes: state.pen.nodes }],
    fill: closed ? currentStyle.fill : 'none',
    stroke: currentStyle.stroke, strokeWidth: currentStyle.strokeWidth,
    opacity: 1, visible: true, locked: false
  };
  state.doc.objects.push(obj);
  state.pen = null;
  state.sel.objs = [obj.id];
  commit('パスを作成');
  renderAll();
}
function nextNameNum() {
  return state.doc.objects.length + 1;
}

/* --- ポインタ移動 --- */
function onPointerMove(e) {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const w = toWorld(e.clientX, e.clientY);
  $('#stX').textContent = Math.round(w.x);
  $('#stY').textContent = Math.round(w.y);

  if (pinch && pointers.size >= 2) {
    const pts = Array.from(pointers.values());
    const d = dist(pts[0].x, pts[0].y, pts[1].x, pts[1].y);
    const cx = (pts[0].x + pts[1].x) / 2, cy = (pts[0].y + pts[1].y) / 2;
    const r = svgEl.getBoundingClientRect();
    const s = clamp(pinch.scale * (d / pinch.d), 0.02, 80);
    const v = state.doc.view;
    v.scale = s;
    v.tx = (cx - r.left) - ((pinch.cx - r.left) - pinch.tx) * (s / pinch.scale);
    v.ty = (cy - r.top) - ((pinch.cy - r.top) - pinch.ty) * (s / pinch.scale);
    applyView();
    return;
  }

  if (!state.drag) return;
  const d = state.drag;
  d.cur = w;

  switch (d.mode) {
    case 'pan': {
      state.doc.view.tx = d.tx + (e.clientX - d.sx);
      state.doc.view.ty = d.ty + (e.clientY - d.sy);
      applyView();
      break;
    }
    case 'marquee': {
      renderOverlay();
      break;
    }
    case 'moveObjs': {
      let dx = w.x - d.start.x, dy = w.y - d.start.y;
      if (e.shiftKey) { if (Math.abs(dx) > Math.abs(dy)) dy = 0; else dx = 0; }
      // スナップ（選択オブジェクトの bbox 左上基準）
      if (state.doc.settings.snapGrid || state.doc.settings.snapObj || state.doc.settings.snapAnchor || state.doc.settings.snapGuides) {
        const exclude = new Set(state.sel.objs.map(rootAncestorId));
        const bb = objsBBox(d.orig.map(o => findObj(o.id)).filter(Boolean));
        if (bb) {
          const snap = applySnap({ x: bb.x + dx, y: bb.y + dy }, exclude);
          dx = snap.x - bb.x; dy = snap.y - bb.y;
        }
      }
      for (const o of d.orig) {
        const obj = findObj(o.id);
        if (!obj) continue;
        const fresh = clone(o.snap);
        // o.snap を基準に差分適用
        const tmp = clone(o.snap);
        translateObj(tmp, dx, dy);
        Object.assign(obj, tmp);
      }
      d.moved = true;
      renderScene(); renderOverlay(); renderProps();
      break;
    }
    case 'scale': {
      const bb = d.bb;
      let nx = bb.x, ny = bb.y, nw = bb.w, nh = bb.h;
      const k = d.handle;
      let dx = w.x - d.start.x, dy = w.y - d.start.y;
      if (k.includes('e')) nw = bb.w + dx;
      if (k.includes('s')) nh = bb.h + dy;
      if (k.includes('w')) { nx = bb.x + dx; nw = bb.w - dx; }
      if (k.includes('n')) { ny = bb.y + dy; nh = bb.h - dy; }
      if (nw < 1) nw = 1;
      if (nh < 1) nh = 1;
      if (e.shiftKey || $('#pRatio').value === '1') {
        const r = bb.w / Math.max(bb.h, 1e-6);
        if (k === 'n' || k === 's') nw = nh * r;
        else if (k === 'e' || k === 'w') nh = nw / r;
        else {
          const s = Math.max(Math.abs(nw / bb.w), Math.abs(nh / bb.h));
          nw = bb.w * s; nh = bb.h * s;
          if (k.includes('w')) nx = bb.x + bb.w - nw;
          if (k.includes('n')) ny = bb.y + bb.h - nh;
        }
      }
      for (const o of d.orig) {
        const obj = findObj(o.id);
        if (!obj) continue;
        const tmp = clone(o.snap);
        setObjBBox(tmp, nx, ny, nw, nh);
        Object.assign(obj, tmp);
      }
      d.moved = true;
      renderScene(); renderOverlay(); renderProps();
      break;
    }
    case 'rotate': {
      const ang = Math.atan2(w.y - d.cy, w.x - d.cx);
      let deg = (ang - d.startAngle) * 180 / Math.PI;
      if (e.shiftKey) deg = Math.round(deg / 15) * 15;
      for (const o of d.orig) {
        const obj = findObj(o.id);
        if (!obj) continue;
        const tmp = clone(o.snap);
        rotateObj(tmp, d.cx, d.cy, deg);
        Object.assign(obj, tmp);
      }
      d.moved = true;
      renderScene(); renderOverlay(); renderProps();
      break;
    }
    case 'moveNodes': {
      let dx = w.x - d.start.x, dy = w.y - d.start.y;
      if (e.shiftKey) { if (Math.abs(dx) > Math.abs(dy)) dy = 0; else dx = 0; }
      for (const it of d.orig) {
        const obj = findObj(it.s.objId);
        if (!obj) continue;
        const node = obj.subpaths[it.s.sp].nodes[it.s.idx];
        const src = it.node;
        node.x = src.x + dx; node.y = src.y + dy;
        node.inX = src.inX + dx; node.inY = src.inY + dy;
        node.outX = src.outX + dx; node.outY = src.outY + dy;
      }
      d.moved = true;
      // 高速更新
      const ids = new Set(state.sel.nodes.map(n => n.objId));
      ids.forEach(id => refreshObjGeometry(findObj(id)));
      renderOverlay(); renderProps();
      break;
    }
    case 'handle': {
      const obj = findObj(d.objId);
      if (!obj) break;
      const node = obj.subpaths[d.sp].nodes[d.idx];
      const dx = w.x - d.start.x, dy = w.y - d.start.y;
      if (d.which === 'out') {
        node.outX = d.orig.subpaths[d.sp].nodes[d.idx].outX + dx;
        node.outY = d.orig.subpaths[d.sp].nodes[d.idx].outY + dy;
        if (node.t === 'smooth' || node.t === 'symmetric' || e.altKey === false && node.t !== 'corner') {
          const vx = node.outX - node.x, vy = node.outY - node.y;
          const len = Math.hypot(vx, vy) || 1;
          const inLen = node.t === 'symmetric' ? len :
            Math.hypot(node.inX - node.x, node.inY - node.y) || len;
          node.inX = node.x - vx / len * inLen;
          node.inY = node.y - vy / len * inLen;
        }
      } else {
        node.inX = d.orig.subpaths[d.sp].nodes[d.idx].inX + dx;
        node.inY = d.orig.subpaths[d.sp].nodes[d.idx].inY + dy;
        if (node.t === 'smooth' || node.t === 'symmetric') {
          const vx = node.inX - node.x, vy = node.inY - node.y;
          const len = Math.hypot(vx, vy) || 1;
          const outLen = node.t === 'symmetric' ? len :
            Math.hypot(node.outX - node.x, node.outY - node.y) || len;
          node.outX = node.x - vx / len * outLen;
          node.outY = node.y - vy / len * outLen;
        }
      }
      d.moved = true;
      refreshObjGeometry(obj);
      renderOverlay(); renderProps();
      break;
    }
    case 'penDrag': {
      const idx = d.nodeIdx;
      const n = state.pen.nodes[idx];
      const dx = w.x - d.start.x, dy = w.y - d.start.y;
      if (Math.hypot(dx, dy) > 3 / state.doc.view.scale) {
        n.outX = n.x + dx; n.outY = n.y + dy;
        n.inX = n.x - dx; n.inY = n.y - dy;
        n.t = 'symmetric';
        d.moved = true;
        renderOverlay();
      }
      break;
    }
    case 'moveGuide': {
      if (d.axis === 'h') {
        const y = w.y;
        state.doc.guides.h[d.index] = y;
        d.moved = true;
      } else {
        const x = w.x;
        state.doc.guides.v[d.index] = x;
        d.moved = true;
      }
      renderOverlay();
      break;
    }
  }
}

function onPointerUp(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  const d = state.drag;
  state.drag = null;
  if (!d) return;

  if (d.mode === 'marquee') {
    const x0 = Math.min(d.start.x, d.cur.x), y0 = Math.min(d.start.y, d.cur.y);
    const x1 = Math.max(d.start.x, d.cur.x), y1 = Math.max(d.start.y, d.cur.y);
    const found = [];
    for (const o of state.doc.objects) {
      if (o.visible === false || o.locked) continue;
      const b = objBBox(o);
      if (!b) continue;
      if (b.x < x1 && b.x + b.w > x0 && b.y < y1 && b.y + b.h > y0) found.push(o.id);
    }
    state.sel.objs = d.add ? Array.from(new Set([...d.base, ...found])) : found;
    state.sel.nodes = [];
    renderAll();
    return;
  }
  if (d.mode === 'penDrag') {
    if (!d.moved) {
      // クリックのみ → 何もしない（次のクリックでノード追加）
    }
    renderOverlay();
    return;
  }
  if (d.moved) {
    commit(
      d.mode === 'moveObjs' ? '移動' :
      d.mode === 'scale' ? '拡大縮小' :
      d.mode === 'rotate' ? '回転' :
      d.mode === 'moveNodes' ? 'アンカー移動' :
      d.mode === 'handle' ? 'ハンドル編集' :
      d.mode === 'moveGuide' ? 'ガイド移動' : '編集'
    );
    renderAll();
  } else {
    renderOverlay();
  }
}

/* --- ダブルクリックでグループ進入 --- */
svgEl.addEventListener('dblclick', e => {
  const hitId = hitTestObject(e.target);
  if (!hitId) { state.enterGroup = []; return; }
  const rootId = rootAncestorId(hitId);
  const rootObj = findObj(rootId);
  if (rootObj && rootObj.type === 'group') {
    state.sel.objs = [hitId];
    renderAll();
  }
});

/* ============================ 11. キーボード ============================ */
window.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const editing = tag === 'input' || tag === 'textarea' || tag === 'select';

  if (e.key === ' ' && !editing) { spaceDown = true; svgEl.style.cursor = 'grab'; }

  if (editing) {
    if (e.key === 'Escape') e.target.blur();
    return;
  }

  const ctrl = e.ctrlKey || e.metaKey;

  // ツール切替
  if (!ctrl) {
    switch (e.key.toLowerCase()) {
      case 'v': setTool('select'); e.preventDefault(); return;
      case 'a': setTool('node'); e.preventDefault(); return;
      case 'p': setTool('pen'); e.preventDefault(); return;
      case 'r': setTool('rect'); e.preventDefault(); return;
      case 'e': setTool('ellipse'); e.preventDefault(); return;
      case 'g': setTool('polygon'); e.preventDefault(); return;
      case 'l': setTool('line'); e.preventDefault(); return;
      case 'b': setTool('shaper'); e.preventDefault(); return;
      case 'h': setTool('hand'); e.preventDefault(); return;
      case 'z': setTool('zoom'); e.preventDefault(); return;
    }
  }

  if (ctrl && e.key.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
  if (ctrl && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey))) { e.preventDefault(); redo(); return; }
  if (ctrl && e.key.toLowerCase() === 'a') { e.preventDefault(); selectAll(); return; }
  if (ctrl && e.key.toLowerCase() === 'c') { e.preventDefault(); copySelection('svg'); return; }
  if (ctrl && e.key.toLowerCase() === 'x') { e.preventDefault(); copySelection('svg', true); return; }
  if (ctrl && e.key.toLowerCase() === 'v') { e.preventDefault(); pasteClipboard(); return; }
  if (ctrl && e.key.toLowerCase() === 'd') { e.preventDefault(); duplicateSelection(); return; }
  if (ctrl && e.key.toLowerCase() === 'g' && !e.shiftKey) { e.preventDefault(); groupSelection(); return; }
  if (ctrl && e.key.toLowerCase() === 'g' && e.shiftKey) { e.preventDefault(); ungroupSelection(); return; }
  if (ctrl && e.key.toLowerCase() === 'j') { e.preventDefault(); joinPaths(); return; }
  if (ctrl && e.key === ']') { e.preventDefault(); changeOrder(e.shiftKey ? 'front' : 'forward'); return; }
  if (ctrl && e.key === '[') { e.preventDefault(); changeOrder(e.shiftKey ? 'back' : 'backward'); return; }
  if (ctrl && e.key === '0') { e.preventDefault(); zoomFit(); return; }
  if (ctrl && e.key === '1') { e.preventDefault(); zoom100(); return; }
  if (ctrl && e.key === '=') { e.preventDefault(); zoomAt(innerWidth / 2, innerHeight / 2, 1.25); return; }
  if (ctrl && e.key === '-') { e.preventDefault(); zoomAt(innerWidth / 2, innerHeight / 2, 0.8); return; }

  if (e.key === 'Delete') {
    e.preventDefault();
    if (state.sel.nodes.length) {
      if (e.shiftKey) smartDelete(); else deleteSelectedNodes();
    } else {
      deleteSelection();
    }
    return;
  }
  if (e.key === 'Backspace') {
    e.preventDefault();
    if (state.sel.nodes.length) smartDelete(); else deleteSelection();
    return;
  }
  if (e.key === 'Escape') {
    if (state.pen) { finishPen(false); return; }
    state.sel.objs = []; state.sel.nodes = []; renderAll();
    return;
  }
  if (e.key === 'Enter') {
    if (state.pen) { finishPen(false); return; }
  }
  // 矢印で移動
  if (e.key.startsWith('Arrow')) {
    e.preventDefault();
    const step = e.shiftKey ? 10 : 1;
    let dx = 0, dy = 0;
    if (e.key === 'ArrowLeft') dx = -step;
    if (e.key === 'ArrowRight') dx = step;
    if (e.key === 'ArrowUp') dy = -step;
    if (e.key === 'ArrowDown') dy = step;
    nudge(dx, dy);
  }
});
window.addEventListener('keyup', e => {
  if (e.key === ' ') { spaceDown = false; svgEl.style.cursor = ''; }
});

function nudge(dx, dy) {
  if (state.sel.nodes.length) {
    for (const s of state.sel.nodes) {
      const o = findObj(s.objId);
      const n = o && o.subpaths[s.sp] && o.subpaths[s.sp].nodes[s.idx];
      if (!n) continue;
      n.x += dx; n.y += dy; n.inX += dx; n.inY += dy; n.outX += dx; n.outY += dy;
    }
    new Set(state.sel.nodes.map(s => s.objId)).forEach(id => refreshObjGeometry(findObj(id)));
  } else {
    for (const o of selectedObjects()) translateObj(o, dx, dy);
    renderScene();
  }
  renderOverlay(); renderProps(); commit('移動');
}

/* ============================ 12. 選択操作 ============================ */
function selectAll() {
  state.sel.objs = state.doc.objects.filter(o => !o.locked && o.visible !== false).map(o => o.id);
  state.sel.nodes = [];
  renderAll();
}
function deleteSelection() {
  if (!state.sel.objs.length) return;
  for (const id of state.sel.objs.slice()) {
    const p = findParentList(id);
    if (p) p.list.splice(p.index, 1);
  }
  state.sel.objs = []; state.sel.nodes = [];
  commit('削除');
  renderAll();
}
function duplicateSelection() {
  if (!state.sel.objs.length) return;
  const newIds = [];
  for (const id of state.sel.objs) {
    const obj = findObj(id);
    const p = findParentList(id);
    if (!obj || !p) continue;
    const c = clone(obj);
    reassignIds(c);
    c.name = obj.name + ' のコピー';
    p.list.splice(p.index + 1, 0, c);
    translateObj(c, 10, 10);
    newIds.push(c.id);
  }
  state.sel.objs = newIds;
  commit('複製');
  renderAll();
}
function reassignIds(obj) {
  obj.id = uid(obj.type === 'group' ? 'g' : 'o');
  if (obj.type === 'group') obj.children.forEach(reassignIds);
}
function groupSelection() {
  if (state.sel.objs.length < 2) { toast('2つ以上選択してください'); return; }
  const objs = [];
  const insertIdx = Math.min(...state.sel.objs.map(id => {
    const p = findParentList(id); return p ? p.index : 0;
  }));
  const topIds = state.sel.objs.map(rootAncestorId);
  const uniq = Array.from(new Set(topIds));
  // 最上位リストのみでグループ化（簡易）
  const list = state.doc.objects;
  const items = [];
  for (const id of uniq) {
    const idx = list.findIndex(o => o.id === id);
    if (idx >= 0) { items.push({ idx, obj: list[idx] }); }
  }
  items.sort((a, b) => a.idx - b.idx);
  if (items.length < 2) { toast('同じ階層のオブジェクトを2つ以上選択してください'); return; }
  const first = items[0].idx;
  const children = items.map(i => i.obj);
  for (let i = items.length - 1; i >= 0; i--) list.splice(items[i].idx, 1);
  const g = {
    id: uid('g'), type: 'group', name: 'グループ ' + (state.doc.objects.length + 1),
    children, visible: true, locked: false, opacity: 1
  };
  list.splice(first, 0, g);
  state.sel.objs = [g.id];
  commit('グループ化');
  renderAll();
}
function ungroupSelection() {
  let any = false;
  for (const id of state.sel.objs.slice()) {
    const p = findParentList(id);
    if (!p) continue;
    const obj = p.list[p.index];
    if (obj.type !== 'group') continue;
    p.list.splice(p.index, 1, ...obj.children);
    any = true;
  }
  if (!any) { toast('グループが選択されていません'); return; }
  state.sel.objs = [];
  commit('グループ解除');
  renderAll();
}
function changeOrder(dir) {
  if (!state.sel.objs.length) return;
  const list = state.doc.objects;
  for (const id of state.sel.objs) {
    const p = findParentList(id);
    if (!p) continue;
    const i = p.index;
    if (dir === 'front') { p.list.push(p.list.splice(i, 1)[0]); }
    else if (dir === 'back') { p.list.unshift(p.list.splice(i, 1)[0]); }
    else if (dir === 'forward' && i < p.list.length - 1) {
      const t = p.list[i]; p.list[i] = p.list[i + 1]; p.list[i + 1] = t;
    } else if (dir === 'backward' && i > 0) {
      const t = p.list[i]; p.list[i] = p.list[i - 1]; p.list[i - 1] = t;
    }
  }
  commit('重ね順変更');
  renderAll();
}

/* ============================ 13. 整列 / 均等配置 ============================ */
function alignObjects(mode) {
  const objs = selectedObjects();
  if (objs.length < 2) { toast('2つ以上選択してください'); return; }
  const bb = objsBBox(objs);
  if (!bb) return;
  if (mode === 'hdist') {
    const items = objs.map(o => ({ o, b: objBBox(o) })).filter(i => i.b).sort((a, b) => a.b.x - b.b.x);
    if (items.length < 3) { toast('均等配置には3つ以上必要です'); return; }
    const totalW = items.reduce((s, i) => s + i.b.w, 0);
    const gap = (bb.w - totalW) / (items.length - 1);
    let x = bb.x;
    for (const it of items) {
      translateObj(it.o, x - it.b.x, 0);
      x += it.b.w + gap;
    }
  } else if (mode === 'vdist') {
    const items = objs.map(o => ({ o, b: objBBox(o) })).filter(i => i.b).sort((a, b) => a.b.y - b.b.y);
    if (items.length < 3) { toast('均等配置には3つ以上必要です'); return; }
    const totalH = items.reduce((s, i) => s + i.b.h, 0);
    const gap = (bb.h - totalH) / (items.length - 1);
    let y = bb.y;
    for (const it of items) {
      translateObj(it.o, 0, y - it.b.y);
      y += it.b.h + gap;
    }
  } else if (mode === 'wmatch') {
    const ref = objs[0]; const rb = objBBox(ref);
    objs.slice(1).forEach(o => { const b = objBBox(o); setObjBBox(o, b.x, b.y, rb.w, b.h); });
  } else if (mode === 'hmatch') {
    const ref = objs[0]; const rb = objBBox(ref);
    objs.slice(1).forEach(o => { const b = objBBox(o); setObjBBox(o, b.x, b.y, b.w, rb.h); });
  } else if (mode === 'whmatch') {
    const ref = objs[0]; const rb = objBBox(ref);
    objs.slice(1).forEach(o => { const b = objBBox(o); setObjBBox(o, b.x, b.y, rb.w, rb.h); });
  } else if (mode === 'center') {
    objs.forEach(o => {
      const b = objBBox(o);
      translateObj(o, (bb.x + bb.w / 2) - (b.x + b.w / 2), (bb.y + bb.h / 2) - (b.y + b.h / 2));
    });
  } else {
    objs.forEach(o => {
      const b = objBBox(o);
      let dx = 0, dy = 0;
      if (mode === 'left') dx = bb.x - b.x;
      if (mode === 'right') dx = (bb.x + bb.w) - (b.x + b.w);
      if (mode === 'hcenter') dx = (bb.x + bb.w / 2) - (b.x + b.w / 2);
      if (mode === 'top') dy = bb.y - b.y;
      if (mode === 'bottom') dy = (bb.y + bb.h) - (b.y + b.h);
      if (mode === 'vcenter') dy = (bb.y + bb.h / 2) - (b.y + b.h / 2);
      translateObj(o, dx, dy);
    });
  }
  commit('整列');
  renderAll();
}

function alignNodes(mode) {
  if (state.sel.nodes.length < 2) { toast('アンカーを2つ以上選択してください'); return; }
  const items = state.sel.nodes.map(s => {
    const o = findObj(s.objId);
    const n = o.subpaths[s.sp].nodes[s.idx];
    return { s, o, n };
  });
  const xs = items.map(i => i.n.x), ys = items.map(i => i.n.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const moveNode = (it, nx, ny) => {
    const dx = nx - it.n.x, dy = ny - it.n.y;
    it.n.x += dx; it.n.y += dy;
    it.n.inX += dx; it.n.inY += dy;
    it.n.outX += dx; it.n.outY += dy;
  };
  if (mode === 'hdist') {
    const sorted = items.slice().sort((a, b) => a.n.x - b.n.x);
    const step = (maxX - minX) / (sorted.length - 1);
    sorted.forEach((it, i) => moveNode(it, minX + step * i, it.n.y));
  } else if (mode === 'vdist') {
    const sorted = items.slice().sort((a, b) => a.n.y - b.n.y);
    const step = (maxY - minY) / (sorted.length - 1);
    sorted.forEach((it, i) => moveNode(it, it.n.x, minY + step * i));
  } else {
    for (const it of items) {
      if (mode === 'left') moveNode(it, minX, it.n.y);
      if (mode === 'right') moveNode(it, maxX, it.n.y);
      if (mode === 'hcenter') moveNode(it, (minX + maxX) / 2, it.n.y);
      if (mode === 'top') moveNode(it, it.n.x, minY);
      if (mode === 'bottom') moveNode(it, it.n.x, maxY);
      if (mode === 'vcenter') moveNode(it, it.n.x, (minY + maxY) / 2);
    }
  }
  new Set(items.map(i => i.o.id)).forEach(id => refreshObjGeometry(findObj(id)));
  commit('アンカー整列');
  renderAll();
}

/* ============================ 14. パス編集 ============================ */
function deleteSelectedNodes() {
  if (!state.sel.nodes.length) return;
  const byObj = {};
  for (const s of state.sel.nodes) {
    (byObj[s.objId] = byObj[s.objId] || []).push(s);
  }
  for (const [objId, list] of Object.entries(byObj)) {
    const obj = findObj(objId);
    if (!obj || obj.type !== 'path') continue;
    const bySp = {};
    for (const s of list) (bySp[s.sp] = bySp[s.sp] || []).push(s.idx);
    for (const [spIdx, idxs] of Object.entries(bySp)) {
      const sp = obj.subpaths[spIdx];
      if (!sp) continue;
      const sorted = idxs.slice().sort((a, b) => b - a);
      for (const i of sorted) sp.nodes.splice(i, 1);
      if (sp.nodes.length < 2) obj.subpaths.splice(spIdx, 1);
    }
  }
  state.sel.nodes = [];
  cleanupEmptyObjects();
  commit('頂点削除');
  renderAll();
}

function cleanupEmptyObjects(list = state.doc.objects) {
  for (let i = list.length - 1; i >= 0; i--) {
    const o = list[i];
    if (o.type === 'group') { cleanupEmptyObjects(o.children); if (!o.children.length) list.splice(i, 1); }
    else if (o.type === 'path' && (!o.subpaths || !o.subpaths.length)) list.splice(i, 1);
  }
}

/** Smart Delete: 形状を維持しながら頂点を削除 */
function smartDelete() {
  if (!state.sel.nodes.length) { toast('アンカーを選択してください'); return; }
  const byObj = {};
  for (const s of state.sel.nodes) (byObj[s.objId] = byObj[s.objId] || []).push(s);
  let count = 0;
  for (const [objId, list] of Object.entries(byObj)) {
    const obj = findObj(objId);
    if (!obj || obj.type !== 'path') continue;
    const bySp = {};
    for (const s of list) (bySp[s.sp] = bySp[s.sp] || []).push(s.idx);
    const spIdxs = Object.keys(bySp).map(Number).sort((a, b) => b - a);
    for (const spIdx of spIdxs) {
      const sp = obj.subpaths[spIdx];
      if (!sp) continue;
      const del = bySp[spIdx].slice().sort((a, b) => a - b);
      count += smartDeleteInSubpath(sp, del);
    }
  }
  state.sel.nodes = [];
  cleanupEmptyObjects();
  commit('Smart Delete');
  renderAll();
  toast(`Smart Delete: ${count} 個の頂点を形状を維持して削除しました`);
}

function smartDeleteInSubpath(sp, delIdxs) {
  const N = sp.nodes.length;
  const delSet = new Set(delIdxs);
  if (delSet.size >= N) { sp.nodes.length = 0; return delSet.size; }

  // 連続する削除区間をまとめる
  const runs = [];
  let cur = null;
  for (const i of delIdxs) {
    if (!cur || i !== cur[cur.length - 1] + 1) { cur = [i]; runs.push(cur); }
    else cur.push(i);
  }
  // 循環を考慮してマージ（先頭と末尾の連続）
  if (sp.closed && runs.length > 1 && runs[0][0] === 0 && runs[runs.length - 1][runs[runs.length - 1].length - 1] === N - 1) {
    const last = runs.pop();
    runs[0] = last.concat(runs[0]);
  }

  const removed = new Set();
  // 後ろから処理（インデックスズレ防止のため、マークして一括再構築）
  const newNodes = [];
  const nodeOf = (i) => sp.nodes[((i % N) + N) % N];

  // 各区間について、前後の生存ノードを求め、曲線をフィットさせる
  const fits = []; // {prevIdx, nextIdx, c1, c2}
  for (const run of runs) {
    if (sp.closed) {
      // 前の生存ノード
      let prevIdx = run[0] - 1;
      while (delSet.has(((prevIdx % N) + N) % N) && prevIdx > run[0] - N) prevIdx--;
      let nextIdx = run[run.length - 1] + 1;
      while (delSet.has(((nextIdx % N) + N) % N) && nextIdx < run[run.length - 1] + N) nextIdx++;
      if (delSet.has(((prevIdx % N) + N) % N) || delSet.has(((nextIdx % N) + N) % N)) continue;
      const fit = fitSegmentBetween(sp, ((prevIdx % N) + N) % N, ((nextIdx % N) + N) % N, true);
      if (fit) fits.push(fit);
    } else {
      const prevIdx = run[0] - 1;
      const nextIdx = run[run.length - 1] + 1;
      if (prevIdx < 0 || nextIdx >= N) continue;
      const fit = fitSegmentBetween(sp, prevIdx, nextIdx, false);
      if (fit) fits.push(fit);
    }
  }

  for (const run of runs) for (const i of run) removed.add(i);
  for (let i = 0; i < N; i++) if (!removed.has(i)) newNodes.push(cloneNode(sp.nodes[i]));

  // ハンドルをフィット結果で更新
  for (const fit of fits) {
    const prevNode = newNodes.find(n => Math.abs(n.x - fit.prevNode.x) < 1e-6 && Math.abs(n.y - fit.prevNode.y) < 1e-6);
    const nextNode = newNodes.find(n => Math.abs(n.x - fit.nextNode.x) < 1e-6 && Math.abs(n.y - fit.nextNode.y) < 1e-6);
    if (prevNode && nextNode) {
      prevNode.outX = fit.c1[0]; prevNode.outY = fit.c1[1];
      nextNode.inX = fit.c2[0]; nextNode.inY = fit.c2[1];
    }
  }
  sp.nodes = newNodes;
  if (sp.nodes.length < 2) sp.nodes = [];
  return removed.size;
}

function fitSegmentBetween(sp, prevIdx, nextIdx, closed) {
  const N = sp.nodes.length;
  const p0 = sp.nodes[prevIdx];
  const p3 = sp.nodes[nextIdx];
  // 元の曲線をサンプリング
  const samples = [];
  let i = prevIdx;
  const guard = N + 2;
  let steps = 0;
  let t0 = 0;
  const total = [];
  while (true) {
    const a = sp.nodes[i];
    const bIdx = (i + 1) % N;
    const b = sp.nodes[bIdx];
    const segs = [];
    for (let s = 0; s <= 8; s++) {
      const t = s / 8;
      const p = isStraightSeg(a, b)
        ? [a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t]
        : cubicAt([a.x, a.y], [a.outX, a.outY], [b.inX, b.inY], [b.x, b.y], t);
      segs.push(p);
    }
    total.push(...segs);
    if (bIdx === nextIdx) break;
    i = bIdx;
    if (++steps > guard) break;
  }
  if (total.length < 3) return null;
  // 間引き
  const sampled = [];
  const stepN = Math.max(1, Math.floor(total.length / 12));
  for (let k = 0; k < total.length; k += stepN) sampled.push({ x: total[k][0], y: total[k][1], t: k / (total.length - 1) });
  if (sampled[sampled.length - 1].t < 1) sampled.push({ x: total[total.length - 1][0], y: total[total.length - 1][1], t: 1 });

  // 接線方向
  let T0, T1;
  const ov = [p0.outX - p0.x, p0.outY - p0.y];
  T0 = (Math.hypot(ov[0], ov[1]) > 1e-6) ? norm(ov) : norm([sampled[1].x - p0.x, sampled[1].y - p0.y]);
  const iv = [p3.x - p3.inX, p3.y - p3.inY];
  T1 = (Math.hypot(iv[0], iv[1]) > 1e-6) ? norm(iv) : norm([p3.x - sampled[sampled.length - 2].x, p3.y - sampled[sampled.length - 2].y]);

  const fit = fitCubic([p0.x, p0.y], [p3.x, p3.y], T0, T1, sampled);
  if (!fit) return null;
  return {
    prevNode: { x: p0.x, y: p0.y }, nextNode: { x: p3.x, y: p3.y },
    c1: fit[0], c2: fit[1]
  };
}
function norm(v) { const l = Math.hypot(v[0], v[1]) || 1; return [v[0] / l, v[1] / l]; }

/* --- パス簡略化 --- */
function simplifyPath(tolerance) {
  const objs = selectedObjects().filter(o => o.type === 'path');
  const targets = objs.length ? objs : [];
  if (!targets.length) { toast('パスを選択してください'); return; }
  let before = 0, after = 0;
  for (const obj of targets) {
    for (const sp of obj.subpaths) {
      before += sp.nodes.length;
      const pts = flattenSubpath(sp, 14);
      if (pts.length < 3) { after += sp.nodes.length; continue; }
      if (sp.closed) {
        // 閉パスは開始点を固定して開いて扱う
        const open = pts.concat([pts[0]]);
        const simp = rdp(open, tolerance);
        simp.pop();
        const ns = polylineToSubpath(simp, true);
        sp.nodes = ns.nodes;
      } else {
        const simp = rdp(pts, tolerance);
        const ns = polylineToSubpath(simp, false);
        sp.nodes = ns.nodes;
      }
      after += sp.nodes.length;
    }
  }
  commit('パス簡略化');
  renderAll();
  toast(`簡略化: ${before} → ${after} 頂点`);
  return { before, after };
}

/* --- スムージング --- */
function smoothPathAll(factor = 0.5) {
  const objs = selectedObjects().filter(o => o.type === 'path');
  if (!objs.length) { toast('パスを選択してください'); return; }
  for (const obj of objs) {
    for (const sp of obj.subpaths) {
      const n = sp.nodes, N = n.length;
      if (N < 3) continue;
      const orig = n.map(cloneNode);
      for (let i = 0; i < N; i++) {
        const hasPrev = sp.closed || i > 0;
        const hasNext = sp.closed || i < N - 1;
        if (!hasPrev || !hasNext) continue;
        const p = orig[i], prev = orig[(i - 1 + N) % N], next = orig[(i + 1) % N];
        const tx = next.x - prev.x, ty = next.y - prev.y;
        const tl = Math.hypot(tx, ty) || 1;
        const l1 = dist(p.x, p.y, prev.x, prev.y) * (1 / 3) * factor;
        const l2 = dist(p.x, p.y, next.x, next.y) * (1 / 3) * factor;
        n[i].outX = p.x + tx / tl * l2;
        n[i].outY = p.y + ty / tl * l2;
        n[i].inX = p.x - tx / tl * l1;
        n[i].inY = p.y - ty / tl * l1;
        n[i].t = 'smooth';
      }
    }
  }
  commit('スムージング');
  renderAll();
}

function smoothSelectedNodes() {
  if (!state.sel.nodes.length) return;
  const byObj = {};
  for (const s of state.sel.nodes) (byObj[s.objId] = byObj[s.objId] || []).push(s);
  for (const [objId, list] of Object.entries(byObj)) {
    const obj = findObj(objId);
    if (!obj || obj.type !== 'path') continue;
    for (const s of list) {
      const sp = obj.subpaths[s.sp];
      const N = sp.nodes.length;
      const i = s.idx;
      const hasPrev = sp.closed || i > 0;
      const hasNext = sp.closed || i < N - 1;
      if (!hasPrev || !hasNext) continue;
      const p = sp.nodes[i], prev = sp.nodes[(i - 1 + N) % N], next = sp.nodes[(i + 1) % N];
      const tx = next.x - prev.x, ty = next.y - prev.y;
      const tl = Math.hypot(tx, ty) || 1;
      const l1 = dist(p.x, p.y, prev.x, prev.y) / 3;
      const l2 = dist(p.x, p.y, next.x, next.y) / 3;
      p.outX = p.x + tx / tl * l2; p.outY = p.y + ty / tl * l2;
      p.inX = p.x - tx / tl * l1; p.inY = p.y - ty / tl * l1;
      p.t = 'smooth';
    }
  }
  commit('スムーズ化');
  renderAll();
}

/* --- ノード種別変更 --- */
function setNodeType(type) {
  if (!state.sel.nodes.length) { toast('アンカーを選択してください'); return; }
  for (const s of state.sel.nodes) {
    const obj = findObj(s.objId);
    const n = obj && obj.subpaths[s.sp] && obj.subpaths[s.sp].nodes[s.idx];
    if (!n) continue;
    if (type === 'corner') {
      n.inX = n.x; n.inY = n.y; n.outX = n.x; n.outY = n.y; n.t = 'corner';
    } else if (type === 'smooth') {
      const sp = obj.subpaths[s.sp];
      const N = sp.nodes.length;
      const prev = sp.nodes[(s.idx - 1 + N) % N], next = sp.nodes[(s.idx + 1) % N];
      const tx = next.x - prev.x, ty = next.y - prev.y;
      const tl = Math.hypot(tx, ty) || 1;
      const l1 = dist(n.x, n.y, prev.x, prev.y) / 3;
      const l2 = dist(n.x, n.y, next.x, next.y) / 3;
      n.outX = n.x + tx / tl * l2; n.outY = n.y + ty / tl * l2;
      n.inX = n.x - tx / tl * l1; n.inY = n.y - ty / tl * l1;
      n.t = 'smooth';
    } else if (type === 'symmetric') {
      const vx = n.outX - n.x, vy = n.outY - n.y;
      const len = Math.hypot(vx, vy);
      if (len < 1e-6) {
        const sp = obj.subpaths[s.sp]; const N = sp.nodes.length;
        const prev = sp.nodes[(s.idx - 1 + N) % N], next = sp.nodes[(s.idx + 1) % N];
        const tx = next.x - prev.x, ty = next.y - prev.y;
        const tl = Math.hypot(tx, ty) || 1;
        const l = Math.min(dist(n.x, n.y, prev.x, prev.y), dist(n.x, n.y, next.x, next.y)) / 3;
        n.outX = n.x + tx / tl * l; n.outY = n.y + ty / tl * l;
        n.inX = n.x - tx / tl * l; n.inY = n.y - ty / tl * l;
      } else {
        n.inX = n.x - vx; n.inY = n.y - vy;
      }
      n.t = 'symmetric';
    } else if (type === 'line') {
      n.inX = n.x; n.inY = n.y; n.outX = n.x; n.outY = n.y; n.t = 'corner';
    }
  }
  commit('ポイント種別変更');
  renderAll();
}

function toCurve() {
  if (!state.sel.nodes.length) { toast('アンカーを選択してください'); return; }
  for (const s of state.sel.nodes) {
    const obj = findObj(s.objId);
    const sp = obj && obj.subpaths[s.sp];
    if (!sp) continue;
    const n = sp.nodes[s.idx];
    const N = sp.nodes.length;
    const prev = sp.nodes[(s.idx - 1 + N) % N], next = sp.nodes[(s.idx + 1) % N];
    const tx = next.x - prev.x, ty = next.y - prev.y;
    const tl = Math.hypot(tx, ty) || 1;
    const l1 = dist(n.x, n.y, prev.x, prev.y) / 3;
    const l2 = dist(n.x, n.y, next.x, next.y) / 3;
    n.outX = n.x + tx / tl * l2; n.outY = n.y + ty / tl * l2;
    n.inX = n.x - tx / tl * l1; n.inY = n.y - ty / tl * l1;
  }
  commit('曲線化');
  renderAll();
}

/* --- パス連結 / 切断 --- */
function joinPaths() {
  const objs = selectedObjects().filter(o => o.type === 'path');
  if (objs.length < 2) { toast('2つのパスを選択してください'); return; }
  const a = objs[0], b = objs[1];
  const sa = a.subpaths[a.subpaths.length - 1];
  const sb = b.subpaths[0];
  if (!sa || !sb || !sa.nodes.length || !sb.nodes.length) { toast('連結できる端点がありません'); return; }
  const endA = sa.nodes[sa.nodes.length - 1];
  const startB = sb.nodes[0];
  const dEnd = dist(endA.x, endA.y, startB.x, startB.y);
  const dEnd2 = dist(endA.x, endA.y, sb.nodes[sb.nodes.length - 1].x, sb.nodes[sb.nodes.length - 1].y);
  if (dEnd2 < dEnd) { sb.nodes.reverse(); }
  // 端点が近ければ統合、そうでなければ線で結ぶ
  const s0 = sb.nodes[0];
  if (dist(endA.x, endA.y, s0.x, s0.y) < 3) {
    endA.outX = s0.outX; endA.outY = s0.outY;
    sb.nodes.shift();
  }
  sa.nodes.push(...sb.nodes);
  b.subpaths.shift();
  if (!b.subpaths.length) {
    const p = findParentList(b.id);
    if (p) p.list.splice(p.index, 1);
  }
  state.sel.objs = [a.id];
  commit('パス連結');
  renderAll();
  toast('パスを連結しました');
}

function splitPathAtNodes() {
  if (!state.sel.nodes.length) { toast('切断するアンカーを選択してください'); return; }
  const byObj = {};
  for (const s of state.sel.nodes) (byObj[s.objId] = byObj[s.objId] || []).push(s);
  for (const [objId, list] of Object.entries(byObj)) {
    const obj = findObj(objId);
    if (!obj || obj.type !== 'path') continue;
    const bySp = {};
    for (const s of list) (bySp[s.sp] = bySp[s.sp] || []).push(s.idx);
    const spIdxs = Object.keys(bySp).map(Number).sort((a, b) => b - a);
    for (const spIdx of spIdxs) {
      const sp = obj.subpaths[spIdx];
      if (!sp) continue;
      const idxs = bySp[spIdx].slice().sort((a, b) => a - b);
      const cuts = idxs.filter(i => i > 0 || sp.closed);
      if (!cuts.length) continue;
      const pieces = [];
      if (sp.closed) {
        // 閉パス：各切断点間を分離
        const N = sp.nodes.length;
        const sorted = Array.from(new Set(cuts)).sort((a, b) => a - b);
        for (let k = 0; k < sorted.length; k++) {
          const s0 = sorted[k], s1 = sorted[(k + 1) % sorted.length];
          const nodes = [];
          let i = s0;
          let guard = 0;
          while (guard++ <= N) {
            nodes.push(cloneNode(sp.nodes[i]));
            if (i === s1) break;
            i = (i + 1) % N;
          }
          if (nodes.length > 1) pieces.push({ closed: false, nodes });
        }
      } else {
        const sorted = Array.from(new Set(cuts)).sort((a, b) => a - b);
        let start = 0;
        for (const c of sorted) {
          const nodes = sp.nodes.slice(start, c + 1).map(cloneNode);
          if (nodes.length > 1) pieces.push({ closed: false, nodes });
          start = c;
        }
        const rest = sp.nodes.slice(start).map(cloneNode);
        if (rest.length > 1) pieces.push({ closed: false, nodes: rest });
      }
      obj.subpaths.splice(spIdx, 1, ...pieces);
    }
  }
  state.sel.nodes = [];
  commit('パス切断');
  renderAll();
  toast('パスを切断しました');
}

function closeOpenPath(closed) {
  const objs = selectedObjects().filter(o => o.type === 'path');
  if (!objs.length) { toast('パスを選択してください'); return; }
  for (const obj of objs) for (const sp of obj.subpaths) {
    if (sp.nodes.length < 2) continue;
    sp.closed = !!closed;
  }
  commit(closed ? 'パスを閉じる' : 'パスを開く');
  renderAll();
}
function reversePath() {
  const objs = selectedObjects().filter(o => o.type === 'path');
  if (!objs.length) { toast('パスを選択してください'); return; }
  for (const obj of objs) for (const sp of obj.subpaths) {
    sp.nodes.reverse();
    for (const n of sp.nodes) {
      const ix = n.inX, iy = n.inY;
      n.inX = n.outX; n.inY = n.outY;
      n.outX = ix; n.outY = iy;
    }
  }
  commit('パス反転');
  renderAll();
}

/* --- オフセット --- */
function offsetSelected(distance, join) {
  const objs = selectedObjects().filter(o => o.type === 'path');
  if (!objs.length) { toast('パスを選択してください'); return; }
  for (const obj of objs) {
    const newSubs = [];
    for (const sp of obj.subpaths) {
      const pts = flattenSubpath(sp, 12);
      if (pts.length < 2) continue;
      const off = offsetPolyline(pts, distance, sp.closed, join);
      const ns = polylineToSubpath(off, sp.closed, 0.65);
      newSubs.push(ns);
    }
    if (newSubs.length) obj.subpaths = newSubs;
  }
  commit('オフセットパス');
  renderAll();
}

/* ============================ 15. 図形の合成 ============================ */
function shapeRingsOf(obj) {
  const rings = [];
  for (const sp of obj.subpaths) {
    const pts = flattenSubpath(sp, 10);
    if (pts.length >= 3) rings.push(pts);
  }
  return rings;
}
function loopsToSubpaths(loops, simplifyTol) {
  const subs = [];
  for (const loop of loops) {
    let pts = loop.pts;
    if (simplifyTol > 0) pts = rdp(pts.concat([pts[0]]), simplifyTol).slice(0, -1);
    if (pts.length < 3) continue;
    const sp = polylineToSubpath(pts, true, 0.72);
    subs.push(sp);
  }
  return subs;
}

function booleanOperation(op) {
  const objs = selectedObjects().filter(o => o.type === 'path' && o.subpaths.length);
  if (objs.length < 2) { toast('パスを2つ以上選択してください'); return; }
  const shapes = objs.map(shapeRingsOf);
  const loops = booleanRings(shapes, op === 'compound' ? 'union' : op);
  if (!loops.length) { toast('結果が空になりました'); return; }

  const bb = objsBBox(objs);
  const tol = Math.max(0.15, Math.min(bb.w, bb.h) * 0.0015);

  let subs = [];
  if (op === 'fragment') {
    // 領域ごとに個別オブジェクト化
    const groups = new Map();
    for (const l of loops) {
      if (!groups.has(l.sig)) groups.set(l.sig, []);
      groups.get(l.sig).push(l);
    }
    const list = findParentList(objs[0].id);
    let insertAt = list ? list.index : state.doc.objects.length;
    const newIds = [];
    for (const [sig, ls] of groups) {
      const o = mkPathObject(loopsToSubpaths(ls, tol), objs[0]);
      o.name = 'フラグメント ' + sig;
      state.doc.objects.splice(insertAt++, 0, o);
      newIds.push(o.id);
    }
    for (const o of objs) { const p = findParentList(o.id); if (p) p.list.splice(p.index, 1); }
    state.sel.objs = newIds;
    commit('分割 (Fragment)');
    renderAll();
    return;
  }

  subs = loopsToSubpaths(loops, tol);
  const base = objs[0];
  const result = mkPathObject(subs, base);
  result.name = { union: '結合', subtract: '型抜き', intersect: '交差', xor: '排他', compound: '複合パス' }[op] || '合成';
  if (op === 'compound') result.fillRule = 'evenodd';

  const list = findParentList(base.id);
  const idx = list ? list.index : state.doc.objects.length;
  for (const o of objs) { const p = findParentList(o.id); if (p) p.list.splice(p.index, 1); }
  state.doc.objects.splice(Math.min(idx, state.doc.objects.length), 0, result);
  state.sel.objs = [result.id];
  commit('図形の合成');
  renderAll();
  toast(`${result.name} を実行しました（${subs.length} サブパス）`);
}

function mkPathObject(subpaths, style) {
  return {
    id: uid('p'), type: 'path', name: 'パス',
    subpaths: subpaths.filter(sp => sp.nodes.length >= 2),
    fill: style.fill !== 'none' ? style.fill : currentStyle.fill,
    stroke: style.stroke || 'none',
    strokeWidth: style.strokeWidth || 0,
    opacity: 1, visible: true, locked: false
  };
}

/* --- Shape Builder --- */
function buildShapeBuilderRegions() {
  const objs = selectedObjects().filter(o => o.type === 'path' && o.subpaths.length);
  if (objs.length < 2) { state.sb.regions = []; return []; }
  const shapes = objs.map(shapeRingsOf);
  const loops = booleanRings(shapes, 'fragment');
  const bb = objsBBox(objs);
  const tol = Math.max(0.2, Math.min(bb.w, bb.h) * 0.0015);
  const regions = [];
  let i = 0;
  for (const l of loops) {
    let pts = l.pts;
    if (tol > 0 && pts.length > 4) {
      const s = rdp(pts.concat([pts[0]]), tol);
      pts = s.slice(0, -1);
    }
    if (pts.length < 3) continue;
    regions.push({ id: 'r' + (i++), pts, sig: l.sig, sourceObjs: objs.map(o => o.id) });
  }
  state.sb.regions = regions;
  state.sb.picked = new Set(regions.map(r => r.id));
  return regions;
}
function hitRegion(w) {
  for (let i = state.sb.regions.length - 1; i >= 0; i--) {
    const r = state.sb.regions[i];
    if (windingNumber(r.pts, w.x, w.y) !== 0) return r;
  }
  return null;
}
function applyShapeBuilder() {
  if (!state.sb.regions.length) { toast('シェイプビルダーを実行するには2つ以上のパスを選択してください'); return; }
  const picked = state.sb.regions.filter(r => state.sb.picked.has(r.id));
  if (!picked.length) { toast('残す領域がありません'); return; }
  const base = selectedObjects()[0];
  const bb = objsBBox(selectedObjects());
  const tol = Math.max(0.2, Math.min(bb.w, bb.h) * 0.0015);
  const subs = [];
  for (const r of picked) {
    const sp = polylineToSubpath(r.pts, true, 0.72);
    if (sp.nodes.length >= 2) subs.push(sp);
  }
  const result = mkPathObject(subs, base);
  result.name = 'シェイプビルダー結果';
  const list = state.doc.objects;
  const ids = new Set(selectedObjects().map(o => o.id));
  let insertIdx = list.length;
  for (let i = list.length - 1; i >= 0; i--) {
    if (ids.has(list[i].id)) { insertIdx = i; list.splice(i, 1); }
  }
  list.splice(Math.min(insertIdx, list.length), 0, result);
  state.sel.objs = [result.id];
  state.sb.regions = []; state.sb.picked.clear();
  setTool('select');
  commit('シェイプビルダー適用');
  renderAll();
  toast('シェイプビルダーを適用しました');
}

/* ============================ 16. レイヤーパネル ============================ */
function renderLayers() {
  const root = $('#layerTree');
  const frag = document.createDocumentFragment();
  const build = (list, depth) => {
    for (let i = list.length - 1; i >= 0; i--) {
      const o = list[i];
      const row = document.createElement('div');
      row.className = 'lrow';
      if (state.sel.objs.includes(o.id)) row.classList.add('sel');
      if (o.visible === false) row.classList.add('dim');
      row.dataset.id = o.id;
      row.draggable = true;

      const pad = document.createElement('span');
      pad.style.width = (depth * 12) + 'px';
      pad.style.flex = 'none';
      row.appendChild(pad);

      const typeIcon = document.createElement('span');
      typeIcon.className = 'lt';
      typeIcon.textContent = o.type === 'group' ? '📁' : (o.type === 'image' ? '🖼' : '◆');
      row.appendChild(typeIcon);

      const nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = o.name || o.id;
      nm.title = o.name || o.id;
      row.appendChild(nm);

      const lock = document.createElement('span');
      lock.className = 'ic';
      lock.textContent = o.locked ? '🔒' : '🔓';
      lock.onclick = (ev) => { ev.stopPropagation(); o.locked = !o.locked; renderAll(); commit('ロック切替'); };
      row.appendChild(lock);

      const vis = document.createElement('span');
      vis.className = 'ic';
      vis.textContent = o.visible === false ? '🚫' : '👁';
      vis.onclick = (ev) => { ev.stopPropagation(); o.visible = o.visible === false; renderAll(); commit('表示切替'); };
      row.appendChild(vis);

      row.onclick = (ev) => {
        if (ev.shiftKey || ev.ctrlKey || ev.metaKey) {
          if (state.sel.objs.includes(o.id)) state.sel.objs = state.sel.objs.filter(x => x !== o.id);
          else state.sel.objs.push(o.id);
        } else {
          state.sel.objs = [o.id];
          state.sel.nodes = [];
        }
        renderAll();
      };
      row.ondblclick = () => {
        const inp = document.createElement('input');
        inp.type = 'text'; inp.value = o.name || '';
        row.replaceChild(inp, nm);
        inp.focus(); inp.select();
        const done = () => { o.name = inp.value || o.name; commit('名前変更'); renderAll(); };
        inp.onblur = done;
        inp.onkeydown = (ev) => { if (ev.key === 'Enter') done(); ev.stopPropagation(); };
      };

      // DnD
      row.ondragstart = (ev) => {
        ev.dataTransfer.setData('text/plain', o.id);
        ev.dataTransfer.effectAllowed = 'move';
      };
      row.ondragover = (ev) => { ev.preventDefault(); row.classList.add('dragover'); };
      row.ondragleave = () => row.classList.remove('dragover');
      row.ondrop = (ev) => {
        ev.preventDefault(); row.classList.remove('dragover');
        const srcId = ev.dataTransfer.getData('text/plain');
        if (srcId === o.id) return;
        const srcP = findParentList(srcId);
        const dstP = findParentList(o.id);
        if (!srcP) return;
        const srcObj = srcP.list[srcP.index];
        // 自分自身の子孫には移動不可
        if (srcObj.type === 'group' && findObj(o.id, srcObj.children)) return;
        srcP.list.splice(srcP.index, 1);
        const dstP2 = findParentList(o.id);
        if (!dstP2) { state.doc.objects.push(srcObj); }
        else dstP2.list.splice(dstP2.index, 0, srcObj);
        commit('レイヤー移動');
        renderAll();
      };

      frag.appendChild(row);
      if (o.type === 'group') build(o.children, depth + 1);
    }
  };
  build(state.doc.objects, 0);
  root.replaceChildren(frag);
}

/* ============================ 17. プロパティパネル ============================ */
function renderProps() {
  const objs = selectedObjects();
  if (objs.length) {
    const bb = objsBBox(objs);
    if (bb) {
      if (document.activeElement !== $('#pX')) $('#pX').value = rnd(bb.x, 2);
      if (document.activeElement !== $('#pY')) $('#pY').value = rnd(bb.y, 2);
      if (document.activeElement !== $('#pW')) $('#pW').value = rnd(bb.w, 2);
      if (document.activeElement !== $('#pH')) $('#pH').value = rnd(bb.h, 2);
    }

  if (state.sel.nodes.length) {
    const n0 = getFirstSelNode();
    if (n0) {
      if (document.activeElement !== $('#aX')) $('#aX').value = rnd(n0.x, 2);
      if (document.activeElement !== $('#aY')) $('#aY').value = rnd(n0.y, 2);
      const vx = n0.outX - n0.x, vy = n0.outY - n0.y;
      if (document.activeElement !== $('#aAng')) $('#aAng').value = rnd(Math.atan2(vy, vx) * 180 / Math.PI, 1);
      if (document.activeElement !== $('#aLen')) $('#aLen').value = rnd(Math.hypot(vx, vy), 2);
    }
    $('#anchorCount').textContent = `${state.sel.nodes.length} 個のアンカーを選択中`;
  } else {
    ['#aX', '#aY', '#aAng', '#aLen'].forEach(s => { if (document.activeElement !== $(s)) $(s).value = ''; });
    $('#anchorCount').textContent = '';
  }
}
function getFirstSelNode() {
  const s = state.sel.nodes[0];
  if (!s) return null;
  const o = findObj(s.objId);
  return o && o.subpaths[s.sp] && o.subpaths[s.sp].nodes[s.idx];
}

/* ============================ 18. ツール ============================ */
const currentStyle = { fill: '#4a9eff', stroke: 'none', strokeWidth: 1 };

  $$('#toolBox .tool').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
  $$('#mobileBar button[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === t));

}

/* ============================ 19. SVG生成 / 入出力 ============================ */
function buildSVGString(opts = {}) {
  const useSel = opts.selection && state.sel.objs.length;
  const objs = useSel ? selectedObjects() : state.doc.objects;
  const bb = objsBBox(objs) || { x: 0, y: 0, w: 100, h: 100 };
  const pad = 2;
  const vb = `${rnd(bb.x - pad)} ${rnd(bb.y - pad)} ${rnd(Math.max(bb.w + pad * 2, 1))} ${rnd(Math.max(bb.h + pad * 2, 1))}`;
  let body = '';
  for (const o of objs) body += objToSVG(o, opts);
  return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="${vb}" width="${rnd(Math.max(bb.w + pad * 2, 1))}" height="${rnd(Math.max(bb.h + pad * 2, 1))}">${body}</svg>`;
}
function objToSVG(obj, opts = {}) {
  if (obj.visible === false) return '';
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  if (obj.type === 'group') {
    let inner = '';
    for (const c of obj.children) inner += objToSVG(c, opts);
    return `<g id="${esc(obj.id)}" data-name="${esc(obj.name)}">${inner}</g>`;
  }
  if (obj.type === 'image') {
    const t = obj.rotation ? ` transform="rotate(${rnd(obj.rotation)} ${rnd(obj.x + obj.w / 2)} ${rnd(obj.y + obj.h / 2)})"` : '';
    return `<image id="${esc(obj.id)}" x="${rnd(obj.x)}" y="${rnd(obj.y)}" width="${rnd(obj.w)}" height="${rnd(obj.h)}" preserveAspectRatio="none" xlink:href="${obj.href}"${t}/>`;
  }
  const fill = obj.fill && obj.fill !== 'none' ? obj.fill : 'none';
  const stroke = obj.stroke && obj.stroke !== 'none' ? obj.stroke : 'none';
  let attrs = `fill="${fill}"`;
  if (obj.fillRule) attrs += ` fill-rule="${obj.fillRule}"`;
  attrs += ` stroke="${stroke}"`;
  if (stroke !== 'none') attrs += ` stroke-width="${obj.strokeWidth || 1}"`;
  if (obj.opacity != null && obj.opacity !== 1) attrs += ` opacity="${obj.opacity}"`;
  return `<path id="${esc(obj.id)}" data-name="${esc(obj.name)}" d="${pathObjD(obj)}" ${attrs}/>`;
}

function optimizeForPowerPoint() {
  const objs = selectedObjects();
  const targets = objs.length ? objs : state.doc.objects;
  let removedNodes = 0, removedObjs = 0;

  const process = (o) => {
    if (o.type === 'group') { o.children.forEach(process); return; }
    if (o.type !== 'path') return;
    // 空サブパス除去
    o.subpaths = o.subpaths.filter(sp => sp.nodes.length >= 2);
    for (const sp of o.subpaths) {
      const before = sp.nodes.length;
      // 同一点の連続を除去
      const nn = [];
      for (let i = 0; i < sp.nodes.length; i++) {
        const n = sp.nodes[i];
        const p = nn[nn.length - 1];
        if (p && Math.abs(p.x - n.x) < 0.01 && Math.abs(p.y - n.y) < 0.01) {
          p.outX = n.outX; p.outY = n.outY;
          continue;
        }
        nn.push(n);
      }
      sp.nodes = nn;
      // ハンドルが極小なら直線化
      for (const n of sp.nodes) {
        if (Math.hypot(n.outX - n.x, n.outY - n.y) < 0.05) { n.outX = n.x; n.outY = n.y; }
        if (Math.hypot(n.inX - n.x, n.inY - n.y) < 0.05) { n.inX = n.x; n.inY = n.y; }
      }
      removedNodes += before - sp.nodes.length;
    }
    // 極小オブジェクト除去
    const b = objBBox(o);
    if (b && b.w < 0.3 && b.h < 0.3) { o._remove = true; removedObjs++; }
    o.name = o.name || 'パス';
  };
  targets.forEach(process);

  const sweep = (list) => {
    for (let i = list.length - 1; i >= 0; i--) {
      const o = list[i];
      if (o._remove) { list.splice(i, 1); continue; }
      if (o.type === 'group') { sweep(o.children); if (!o.children.length) list.splice(i, 1); }
    }
  };
  sweep(state.doc.objects);

  commit('PowerPoint最適化');
  renderAll();
  toast(`PowerPoint最適化: 頂点 ${removedNodes} 個削減 / 不要オブジェクト ${removedObjs} 個削除<br>すべての図形はパスとして出力されます。`);
}

/* --- SVGインポート --- */
function importSVGString(str, offsetX = 0, offsetY = 0) {
  const doc = new DOMParser().parseFromString(str, 'image/svg+xml');
  if (doc.querySelector('parsererror')) { toast('SVGの解析に失敗しました'); return null; }
  const svg = doc.documentElement;
  // viewBox からスケールを決定（等倍で読み込む）
  const vb = (svg.getAttribute('viewBox') || '').split(/[\s,]+/).map(Number);
  let tf = { a: 1, b: 0, c: 0, d: 1, e: 0, f: 0 };
  if (vb.length === 4) tf = { a: 1, b: 0, c: 0, d: 1, e: -vb[0], f: -vb[1] };

  const results = [];
  const walk = (el, parentMat) => {
    for (const child of el.children) {
      const tag = child.tagName.toLowerCase();
      const mat = multiplyMat(parentMat, parseTransform(child.getAttribute('transform')));
      if (tag === 'g' || tag === 'svg') { walk(child, mat); continue; }
      if (tag === 'defs' || tag === 'title' || tag === 'desc' || tag === 'style') continue;

      const style = getStyle(child);
      if (tag === 'path') {
        const subs = parsePathD(child.getAttribute('d') || '');
        applyMatrixToSubs(subs, mat);
        if (subs.length) {
          results.push({
            id: uid('p'), type: 'path', name: child.getAttribute('data-name') || 'インポートパス',
            subpaths: subs, fill: style.fill, stroke: style.stroke, strokeWidth: style.strokeWidth,
            fillRule: style.fillRule, opacity: style.opacity, visible: true, locked: false
          });
        }
      } else if (tag === 'rect') {
        const x = +child.getAttribute('x') || 0, y = +child.getAttribute('y') || 0;
        const w = +child.getAttribute('width') || 0, h = +child.getAttribute('height') || 0;
        const rx = +child.getAttribute('rx') || 0;
        const subs = rx > 0 ? roundedRectSub(x, y, w, h, Math.min(rx, w / 2, h / 2))
                            : [rectSub(x, y, w, h)];
        applyMatrixToSubs(subs, mat);
        results.push(mkImported(subs, style, '長方形'));
      } else if (tag === 'circle' || tag === 'ellipse') {
        const cx = +child.getAttribute('cx') || 0, cy = +child.getAttribute('cy') || 0;
        const rx = tag === 'circle' ? (+child.getAttribute('r') || 0) : (+child.getAttribute('rx') || 0);
        const ry = tag === 'circle' ? (+child.getAttribute('r') || 0) : (+child.getAttribute('ry') || 0);
        const subs = [ellipseSub(cx, cy, rx, ry)];
        applyMatrixToSubs(subs, mat);
        results.push(mkImported(subs, style, '楕円'));
      } else if (tag === 'line') {
        const x1 = +child.getAttribute('x1') || 0, y1 = +child.getAttribute('y1') || 0;
        const x2 = +child.getAttribute('x2') || 0, y2 = +child.getAttribute('y2') || 0;
        const subs = [{ closed: false, nodes: [mkNode(x1, y1), mkNode(x2, y2)] }];
        applyMatrixToSubs(subs, mat);
        results.push(mkImported(subs, { ...style, fill: 'none' }, '直線'));
      } else if (tag === 'polyline' || tag === 'polygon') {
        const ptsStr = (child.getAttribute('points') || '').trim().split(/[\s,]+/).map(Number);
        const nodes = [];
        for (let i = 0; i + 1 < ptsStr.length; i += 2) nodes.push(mkNode(ptsStr[i], ptsStr[i + 1]));
        if (nodes.length >= 2) {
          const subs = [{ closed: tag === 'polygon', nodes }];
          applyMatrixToSubs(subs, mat);
          results.push(mkImported(subs, style, tag === 'polygon' ? '多角形' : '折れ線'));
        }
      } else if (tag === 'image') {
        const href = child.getAttribute('href') || child.getAttributeNS('http://www.w3.org/1999/xlink', 'href');
        if (href) {
          const x = +child.getAttribute('x') || 0, y = +child.getAttribute('y') || 0;
          const w = +child.getAttribute('width') || 100, h = +child.getAttribute('height') || 100;
          results.push({
            id: uid('i'), type: 'image', name: '画像', href,
            x: x + offsetX, y: y + offsetY, w, h, rotation: 0, opacity: 1, visible: true, locked: false
          });
        }
      } else if (tag === 'text') {
        // テキストは未対応（パス化されていない場合）
      }
    }
  };
  walk(svg, tf);

  if (!results.length) { toast('取り込めるベクター要素が見つかりませんでした<br>（テキスト・ラスタ画像のみのSVGは未対応です）'); return null; }
  state.doc.objects.push(...results);
  state.sel.objs = results.map(r => r.id);
  commit('SVGインポート');
  renderAll();
  toast(`SVGをインポートしました（${results.length} オブジェクト）`);
  return results;
}
function mkImported(subs, style, name) {
  return {
    id: uid('p'), type: 'path', name,

    fillRule: style.fillRule, opacity: style.opacity, visible: true, locked: false

}

    mkNode(x + w, y + h - r), mkNode(x + w - r, y + h), mkNode(x + r, y + h),
    mkNode(x, y + h - r), mkNode(x, y + r)

  set(0, x + r - k, y, x + r + k, y);
  set(1, x + w - r - k, y, x + w - r + k, y);
  set(2, x + w, y + r - k, x + w, y + r + k);
  set(3, x + w, y + h - r - k, x + w, y + h - r + k);
  set(4, x + w - r + k, y + h, x + w - r - k, y + h);
  set(5, x + r + k, y + h, x + r - k, y + h);
  set(6, x, y + h - r + k, x, y + h - r - k);
  set(7, x, y + r + k, x, y + r - k);
  return { closed: true, nodes };
}
function ellipseSub(cx, cy, rx, ry) {
  const kx = rx * 0.5523, ky = ry * 0.5523;
  const nodes = [mkNode(cx, cy - ry), mkNode(cx + rx, cy), mkNode(cx, cy + ry), mkNode(cx - rx, cy)];
  nodes[0].inX = cx - kx; nodes[0].inY = cy - ry; nodes[0].outX = cx + kx; nodes[0].outY = cy - ry; nodes[0].t = 'smooth';
  nodes[1].inX = cx + rx; nodes[1].inY = cy - ky; nodes[1].outX = cx + rx; nodes[1].outY = cy + ky; nodes[1].t = 'smooth';
  nodes[2].inX = cx + kx; nodes[2].inY = cy + ry; nodes[2].outX = cx - kx; nodes[2].outY = cy + ry; nodes[2].t = 'smooth';
  nodes[3].inX = cx - rx; nodes[3].inY = cy + ky; nodes[3].outX = cx - rx; nodes[3].outY = cy - ky; nodes[3].t = 'smooth';
  return { closed: true, nodes };

function getStyle(el) {

    fill: el.getAttribute('fill') || 'none',
    stroke: el.getAttribute('stroke') || 'none',
    strokeWidth: parseFloat(el.getAttribute('stroke-width')) || 1,
