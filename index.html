<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>VectorForge — PowerPoint向けベクター編集</title>
<style>
:root{
  --bg:#1b1d21; --bg2:#232629; --bg3:#2c3035; --bg4:#353a40;
  --line:#3b4046; --line2:#4a5058;
  --fg:#d7dae0; --fg2:#8f96a0; --fg3:#666d77;
  --acc:#4a9eff; --acc2:#1f6fd0; --accbg:#16324f;
  --danger:#e5534b; --ok:#3fb950; --warn:#d29922;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;
  font:12px/1.45 "Segoe UI",system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;
  background:var(--bg);color:var(--fg);}
button,input,select{font-family:inherit;font-size:12px;color:inherit;}
button{background:var(--bg3);border:1px solid var(--line);color:var(--fg);
  padding:4px 8px;border-radius:3px;cursor:pointer;white-space:nowrap;}
button:hover{background:var(--bg4);border-color:var(--line2);}
button:active{background:var(--accbg);}
button.on{background:var(--accbg);border-color:var(--acc);color:#cfe6ff;}
button:disabled{opacity:.35;cursor:default;}
input[type=text],input[type=number],select{
  background:var(--bg);border:1px solid var(--line);border-radius:3px;
  padding:3px 5px;width:100%;min-width:0;}
input:focus,select:focus{outline:1px solid var(--acc);border-color:var(--acc);}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#444a52;border-radius:5px;}
::-webkit-scrollbar-track{background:transparent;}

#app{display:grid;grid-template-rows:auto 1fr auto;height:100%;height:100dvh;}

/* ---------- top bar ---------- */
#menubar{display:flex;align-items:center;gap:8px;background:var(--bg2);
  border-bottom:1px solid var(--line);padding:5px 8px;overflow-x:auto;overflow-y:hidden;}
#menubar::-webkit-scrollbar{height:0;}
.brand{font-weight:600;letter-spacing:.3px;color:#e8ebf0;white-space:nowrap;padding-right:6px;}
.brand small{color:var(--fg3);font-weight:400;font-size:10px;margin-left:3px;}
.mgroup{display:flex;gap:3px;align-items:center;padding-right:8px;border-right:1px solid var(--line);}
.mgroup:last-child{border-right:none;}
.mgroup label{color:var(--fg3);font-size:10px;}

/* ---------- main ---------- */
#main{display:grid;grid-template-columns:186px 1fr 224px;min-height:0;overflow:hidden;}

/* left */
#leftPanel{background:var(--bg2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;}
.sect{border-bottom:1px solid var(--line);padding:6px 7px;}
.sect h3{margin:0 0 5px;font-size:10px;text-transform:uppercase;letter-spacing:.7px;
  color:var(--fg3);font-weight:600;}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;}
.tool{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  background:var(--bg3);border:1px solid var(--line);border-radius:3px;cursor:pointer;
  font-size:15px;line-height:1;padding:0;position:relative;}
.tool.on{background:var(--accbg);border-color:var(--acc);}
.tool:hover{background:var(--bg4);}
.propgrid{display:grid;grid-template-columns:22px 1fr 22px 1fr;gap:3px;align-items:center;}
.propgrid .lb{color:var(--fg3);font-size:10px;text-align:right;}
.fullrow{grid-column:1/-1;}
.btnrow{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:3px;}
.btnrow.b3{grid-template-columns:repeat(3,1fr);}
.btnrow.b2{grid-template-columns:repeat(2,1fr);}
.btnrow button{padding:3px 2px;font-size:10px;overflow:hidden;text-overflow:ellipsis;}

/* canvas */
#canvasArea{position:relative;display:grid;grid-template-columns:18px 1fr;grid-template-rows:18px 1fr;
  background:#141619;min-width:0;min-height:0;overflow:hidden;}
#rulerCorner{background:var(--bg2);border-right:1px solid var(--line);border-bottom:1px solid var(--line);}
#rulerTop{background:var(--bg2);border-bottom:1px solid var(--line);position:relative;overflow:hidden;}
#rulerLeft{background:var(--bg2);border-right:1px solid var(--line);position:relative;overflow:hidden;}
#canvasWrap{position:relative;overflow:hidden;min-width:0;min-height:0;background:#141619;}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;
  background:#141619;}
#svg.pen{cursor:crosshair;}
#svg.hand{cursor:grab;}
#svg.node{cursor:default;}
#dropHint{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(74,158,255,.12);border:2px dashed var(--acc);color:#cfe6ff;font-size:14px;pointer-events:none;z-index:20;}
#dropHint.show{display:flex;}

/* right */
#rightPanel{background:var(--bg2);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;}
#rightPanel .sect{display:flex;flex-direction:column;min-height:0;flex:1;overflow:hidden;}
#layerTree{flex:1;overflow-y:auto;overflow-x:hidden;min-height:80px;padding:2px 0;}
.lrow{display:flex;align-items:center;gap:4px;padding:2px 5px;cursor:pointer;
  white-space:nowrap;border:1px solid transparent;user-select:none;}
.lrow:hover{background:var(--bg3);}
.lrow.sel{background:var(--accbg);border-color:var(--acc2);}
.lrow .lt{width:14px;text-align:center;color:var(--fg3);font-size:10px;flex:none;}
.lrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;}
.lrow .ic{width:16px;text-align:center;font-size:10px;color:var(--fg3);flex:none;cursor:pointer;}
.lrow .ic:hover{color:var(--fg);}
.lrow.dim .nm{color:var(--fg3);font-style:italic;}
.lrow.dragover{background:var(--accbg);border-color:var(--acc);}
.lrow input{font-size:11px;padding:1px 3px;}

/* status */
#statusbar{display:flex;align-items:center;gap:12px;background:var(--bg2);
  border-top:1px solid var(--line);padding:3px 9px;font-size:11px;color:var(--fg2);
  overflow-x:auto;white-space:nowrap;}
#statusbar b{color:var(--fg);font-weight:500;}
#statusbar .sp{flex:1;}

/* toast */
#toast{position:fixed;left:50%;bottom:52px;transform:translateX(-50%) translateY(20px);
  background:#0d1117;border:1px solid var(--line2);border-radius:5px;padding:8px 14px;
  max-width:min(560px,92vw);font-size:12px;box-shadow:0 6px 26px #000a;opacity:0;
  pointer-events:none;transition:.22s;z-index:200;line-height:1.5;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* modal */
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;
  z-index:300;padding:16px;}
#modal.show{display:flex;}
.modalbox{background:var(--bg2);border:1px solid var(--line2);border-radius:6px;
  max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:16px 18px;box-shadow:0 12px 50px #000b;}
.modalbox h2{margin:0 0 10px;font-size:14px;}
.modalbox table{border-collapse:collapse;width:100%;font-size:12px;}
.modalbox td{padding:3px 8px;border-bottom:1px solid var(--line);}
.modalbox td:first-child{color:var(--acc);font-family:Consolas,monospace;white-space:nowrap;width:170px;}
.modalbox .close{float:right;}
kbd{background:var(--bg4);border:1px solid var(--line2);border-bottom-width:2px;
  border-radius:3px;padding:0 4px;font-family:Consolas,monospace;font-size:11px;}

/* mobile */
#mobileBar{display:none;}
@media (max-width:820px){
  #main{grid-template-columns:1fr;}
  #leftPanel,#rightPanel{position:fixed;top:0;bottom:0;width:270px;z-index:120;
    transition:transform .2s;box-shadow:0 0 30px #000c;}
  #leftPanel{left:0;transform:translateX(-100%);padding-top:env(safe-area-inset-top);}
  #rightPanel{right:0;transform:translateX(100%);}
  #leftPanel.open,#rightPanel.open{transform:none;}
  #canvasArea{grid-template-columns:0 1fr;grid-template-rows:0 1fr;}
  #rulerCorner,#rulerTop,#rulerLeft{display:none;}
  #menubar{padding:4px 6px;}
  .brand small{display:none;}
  #statusbar{font-size:10px;gap:8px;padding-bottom:calc(3px + env(safe-area-inset-bottom));}
  #mobileBar{display:flex;position:fixed;left:8px;right:8px;bottom:calc(30px + env(safe-area-inset-bottom));
    gap:5px;justify-content:center;z-index:110;pointer-events:none;}
  #mobileBar button{pointer-events:auto;background:#2c3035ee;border:1px solid var(--line2);
    backdrop-filter:blur(6px);padding:8px 12px;font-size:14px;border-radius:8px;box-shadow:0 3px 14px #0009;}
  #mobileBar button.on{background:var(--acc);border-color:var(--acc);color:#fff;}
  .tools{grid-template-columns:repeat(5,1fr);}
  .tool{font-size:19px;}
  .lrow{padding:6px 5px;}
  .modalbox td:first-child{width:110px;}
}
#scrim{display:none;position:fixed;inset:0;background:#0007;z-index:110;}
#scrim.show{display:block;}
</style>
</head>
<body>
<div id="app">

  <!-- ======= TOP MENU / TOOLBAR ======= -->
  <header id="menubar">
    <div class="brand">VectorForge<small>for PowerPoint</small></div>

    <div class="mgroup">
      <button id="btnNew" title="新規ドキュメント">新規</button>
      <button id="btnOpen" title="プロジェクト(.vproj)/SVGを開く">開く</button>
      <button id="btnSave" title="プロジェクトを保存 (.vproj)">保存</button>
      <button id="btnBackup" title="完全バックアップ (.vproj)">全バックアップ</button>
    </div>

    <div class="mgroup">
      <button id="btnUndo" title="元に戻す (Ctrl+Z)">↶ 戻す</button>
      <button id="btnRedo" title="やり直し (Ctrl+Y)">↷ やり直し</button>
    </div>

    <div class="mgroup">
      <label>コピー</label>
      <button id="btnCopyPPT" title="PowerPoint向けにコピー（SVG/HTML形式）" style="border-color:var(--acc);color:#bcdcff;">▶ PowerPointへコピー</button>
      <button id="btnCopySVG" title="SVGとしてクリップボードへコピー">SVG</button>
      <button id="btnCopyPNG" title="PNGとしてクリップボードへコピー">PNG</button>
      <button id="btnCopyText" title="SVGソースをテキストとしてコピー">テキスト</button>
    </div>

    <div class="mgroup">
      <button id="btnOptPPT" title="PowerPoint用に構造を最適化">PPT最適化</button>
      <button id="btnExportSVG" title="SVGファイルとして書き出し">SVG出力</button>
      <button id="btnImportSVG" title="SVGファイルを読み込み">SVG取込</button>
      <button id="btnExportPNG" title="PNGファイルとして書き出し">PNG出力</button>
    </div>

    <div class="mgroup">
      <button id="btnZoomFit" title="全体表示 (Ctrl+0)">全体</button>
      <button id="btnZoom100" title="100%">100%</button>
    </div>

    <div class="mgroup">
      <button id="btnShortcuts" title="ショートカット一覧">? ショートカット</button>
      <button id="btnHelp" title="使い方">使い方</button>
    </div>
  </header>

  <div id="main">
    <!-- ======= LEFT ======= -->
    <aside id="leftPanel">
      <div class="sect">
        <h3>ツール</h3>
        <div class="tools" id="toolBox">
          <button class="tool on" data-tool="select" title="選択 (V)">⬈</button>
          <button class="tool" data-tool="node"   title="頂点編集 (A)">◈</button>
          <button class="tool" data-tool="pen"    title="ペン (P)">✎</button>
          <button class="tool" data-tool="rect"   title="長方形 (R)">▭</button>
          <button class="tool" data-tool="ellipse"title="楕円 (E)">◯</button>
          <button class="tool" data-tool="polygon"title="多角形 (G)">⬡</button>
          <button class="tool" data-tool="line"   title="直線 (L)">╱</button>
          <button class="tool" data-tool="shaper" title="シェイプビルダー (B)">◧</button>
          <button class="tool" data-tool="hand"   title="パン (H / Space)">✋</button>
          <button class="tool" data-tool="zoom"   title="ズーム (Z)">🔍</button>
        </div>
        <div class="propgrid" style="margin-top:5px;">
          <span class="lb">辺</span><input type="number" id="polySides" value="6" min="3" max="60">
          <span class="lb">角</span><input type="number" id="polyRound" value="0" min="0" max="50">
        </div>
      </div>

      <div class="sect">
        <h3>オブジェクト情報</h3>
        <div class="propgrid">
          <span class="lb">X</span><input type="number" id="pX" step="1">
          <span class="lb">Y</span><input type="number" id="pY" step="1">
          <span class="lb">W</span><input type="number" id="pW" step="1">
          <span class="lb">H</span><input type="number" id="pH" step="1">
          <span class="lb">回転</span><input type="number" id="pR" step="1">
          <span class="lb">比率</span>
          <select id="pRatio"><option value="1">固定</option><option value="0">自由</option></select>
        </div>
        <div class="btnrow b3" style="margin-top:4px;">
          <button id="btnApplyXY">XY適用</button>
          <button id="btnApplyWH">WH適用</button>
          <button id="btnApplyR">回転適用</button>
        </div>
      </div>

      <div class="sect">
        <h3>アンカー情報</h3>
        <div class="propgrid">
          <span class="lb">X</span><input type="number" id="aX" step="1">
          <span class="lb">Y</span><input type="number" id="aY" step="1">
          <span class="lb">角度</span><input type="number" id="aAng" step="1">
          <span class="lb">長さ</span><input type="number" id="aLen" step="1">
        </div>
        <div class="btnrow" style="margin-top:4px;">
          <button id="btnApplyAnchor">XY適用</button>
          <button id="btnApplyH">角度適用</button>
          <button id="btnMirrorH" title="左右ハンドルを対称化">対称</button>
          <button id="btnBreakH" title="左右ハンドルを独立">独立</button>
        </div>
        <div id="anchorCount" style="color:var(--fg3);font-size:10px;margin-top:4px;"></div>
      </div>

      <div class="sect">
        <h3>アンカー整列</h3>
        <div class="btnrow">
          <button data-nodalign="left"  title="選択アンカーを左揃え">⇤</button>
          <button data-nodalign="hcenter" title="水平中央">⇹</button>
          <button data-nodalign="right" title="右揃え">⇥</button>
          <button data-nodalign="top"   title="上揃え">⇡</button>
          <button data-nodalign="vcenter" title="垂直中央">⇕</button>
          <button data-nodalign="bottom" title="下揃え">⇣</button>
          <button data-nodalign="hdist" title="水平方向に均等配置">⇿H</button>
          <button data-nodalign="vdist" title="垂直方向に均等配置">⇿V</button>
        </div>
      </div>

      <div class="sect">
        <h3>オブジェクト整列</h3>
        <div class="btnrow">
          <button data-objalign="left" title="左揃え">⇤</button>
          <button data-objalign="hcenter" title="水平中央">⇹</button>
          <button data-objalign="right" title="右揃え">⇥</button>
          <button data-objalign="top" title="上揃え">⇡</button>
          <button data-objalign="vcenter" title="垂直中央">⇕</button>
          <button data-objalign="bottom" title="下揃え">⇣</button>
          <button data-objalign="hdist" title="水平方向に均等配置">≡H</button>
          <button data-objalign="vdist" title="垂直方向に均等配置">≡V</button>
          <button data-objalign="wmatch" title="幅を揃える">W=</button>
          <button data-objalign="hmatch" title="高さを揃える">H=</button>
          <button data-objalign="whmatch" title="幅と高さを揃える">WH=</button>
          <button data-objalign="center" title="中心を揃える">◎</button>
        </div>
      </div>

      <div class="sect">
        <h3>重ね順 / グループ</h3>
        <div class="btnrow">
          <button data-order="front" title="最前面へ (Ctrl+Shift+])">⤒</button>
          <button data-order="forward" title="前面へ (Ctrl+])">↑</button>
          <button data-order="backward" title="背面へ (Ctrl+[)">↓</button>
          <button data-order="back" title="最背面へ (Ctrl+Shift+[)">⤓</button>
          <button id="btnGroup" title="グループ化 (Ctrl+G)">グループ</button>
          <button id="btnUngroup" title="グループ解除 (Ctrl+Shift+G)">解除</button>
          <button id="btnDup" title="複製 (Ctrl+D)">複製</button>
          <button id="btnDel" title="削除 (Delete)">削除</button>
        </div>
      </div>

      <div class="sect">
        <h3>パス操作</h3>
        <div class="btnrow b2">
          <button id="btnJoin" title="端点同士を連結 (Ctrl+J)">連結</button>
          <button id="btnSplit" title="選択アンカーでパスを切断">切断</button>
          <button id="btnClose" title="パスを閉じる">閉じる</button>
          <button id="btnOpenP" title="パスを開く">開く</button>
          <button id="btnReverse" title="パス方向を反転">反転</button>
          <button id="btnSmartDel" title="Smart Delete (Shift+Del)">Smart削除</button>
          <button id="btnToLine" title="選択アンカーを直線化">直線化</button>
          <button id="btnToCurve" title="選択アンカーを曲線化">曲線化</button>
          <button id="btnCorner" title="コーナーポイント化">角</button>
          <button id="btnSmooth" title="スムーズポイント化">スムーズ</button>
          <button id="btnSym" title="対称ポイント化">対称</button>
          <button id="btnSmoothPath" title="パス全体をスムージング">全体平滑</button>
        </div>
      </div>

      <div class="sect">
        <h3>図形の合成</h3>
        <div class="btnrow b2">
          <button data-bool="union" title="結合">結合</button>
          <button data-bool="subtract" title="型抜き">型抜き</button>
          <button data-bool="intersect" title="交差">交差</button>
          <button data-bool="xor" title="排他">排他</button>
          <button data-bool="fragment" title="分割" style="grid-column:span 2;">分割 (Fragment)</button>
          <button data-bool="compound" title="複合パス化（穴あけ）" style="grid-column:span 2;">複合パス / 穴あけ</button>
        </div>
      </div>

      <div class="sect">
        <h3>簡略化 / オフセット</h3>
        <label style="color:var(--fg3);font-size:10px;">精度（低←→高）: <span id="simpVal">2.0</span>px / <span id="simpCount">-</span></label>
        <input type="range" id="simpTol" min="0" max="100" value="30" style="width:100%;">
        <div class="btnrow b2">
          <button id="btnSimplify">簡略化</button>
          <button id="btnSmoothAll">スムーズ化</button>
        </div>
        <div class="propgrid" style="margin-top:5px;">
          <span class="lb">距離</span><input type="number" id="offsetDist" value="5" step="1">
          <span class="lb">角</span><select id="offsetJoin"><option value="miter">マイター</option><option value="round">ラウンド</option></select>
        </div>
        <div class="btnrow b2" style="margin-top:3px;">
          <button id="btnOffsetOut">外側 +</button>
          <button id="btnOffsetIn">内側 −</button>
        </div>
      </div>

      <div class="sect">
        <h3>シェイプビルダー</h3>
        <div style="color:var(--fg3);font-size:10px;margin-bottom:4px;">
          Bキーでモード切替。重なった領域をクリックして操作。
        </div>
        <div class="btnrow">
          <button id="sbKeep" class="on">残す</button>
          <button id="sbMerge">結合</button>
          <button id="sbDelete">削除</button>
          <button id="sbApply" style="border-color:var(--acc)">適用</button>
        </div>
        <div id="sbInfo" style="color:var(--fg3);font-size:10px;margin-top:4px;"></div>
      </div>

      <div class="sect">
        <h3>表示 / スナップ</h3>
        <div class="btnrow b2">
          <button id="tgGrid" class="on">グリッド</button>
          <button id="tgGuides" class="on">ガイド</button>
          <button id="tgSnapGrid">Grid吸着</button>
          <button id="tgSnapGuide" class="on">Guide吸着</button>
          <button id="tgSnapObj" class="on">図形吸着</button>
          <button id="tgSnapAnchor" class="on">アンカー吸着</button>
          <button id="btnAddGuideH">横ガイド+</button>
          <button id="btnAddGuideV">縦ガイド+</button>
          <button id="btnClearGuides" style="grid-column:span 2;">ガイド全消去</button>
        </div>
        <div class="propgrid" style="margin-top:5px;">
          <span class="lb">Grid</span><input type="number" id="gridSize" value="20" min="1" step="1">
          <span class="lb">画像</span><button id="btnPlaceImage" style="font-size:10px;">配置…</button>
        </div>
      </div>
    </aside>

    <!-- ======= CANVAS ======= -->
    <div id="canvasArea">
      <div id="rulerCorner"></div>
      <div id="rulerTop"></div>
      <div id="rulerLeft"></div>
      <div id="canvasWrap">
        <svg id="svg" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="gridPat" patternUnits="userSpaceOnUse" width="20" height="20">
              <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#262a30" stroke-width="1"
                    vector-effect="non-scaling-stroke"/>
            </pattern>
          </defs>
          <rect id="gridRect" x="-100000" y="-100000" width="200000" height="200000"
                fill="url(#gridPat)" pointer-events="none"/>
          <g id="sceneRoot"></g>

<script>
"use strict";
/* ==========================================================================
   VectorForge for PowerPoint  —  single-file vector editor
   --------------------------------------------------------------------------
   設計方針:
     doc（データモデル） / render（描画） / interaction（操作） / history（履歴）
     を分離。オブジェクトは常に「SVGパス相当のノード配列」として保持し、
     描画時に d 属性を生成する（データとDOMを分離）。
   ========================================================================== */

/* ============================ 0. 基本ユーティリティ ============================ */
const NS = 'http://www.w3.org/2000/svg';
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const rnd = (v, p = 3) => { const m = Math.pow(10, p); return Math.round(v * m) / m; };
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
let _uid = 0;
const uid = (p = 'o') => p + (Date.now().toString(36)) + (_uid++).toString(36);
const clone = (o) => (typeof structuredClone === 'function' ? structuredClone(o) : JSON.parse(JSON.stringify(o)));

function toast(msg, ms = 3200) {
  const t = $('#toast');
  t.innerHTML = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), ms);
}
function status(msg) { $('#stMsg').textContent = msg; }

function download(name, data, mime) {
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 400);
}

/* ============================ 1. パスデータモデル ============================ */
/*
  Node: { x, y, inX, inY, outX, outY, t }
     - inX/inY   … 進入ハンドル（絶対座標）
     - outX/outY … 退出ハンドル（絶対座標）
     - t         … 'corner' | 'smooth' | 'symmetric'
  Subpath: { closed:bool, nodes:[Node] }
  PathObj: { id, type:'path', name, subpaths:[Subpath], fill, stroke, strokeWidth, ... }
*/
function mkNode(x, y) {
  return { x, y, inX: x, inY: y, outX: x, outY: y, t: 'corner' };
}
function cloneNode(n) {
  return { x: n.x, y: n.y, inX: n.inX, inY: n.inY, outX: n.outX, outY: n.outY, t: n.t };
}
const isStraightSeg = (a, b) =>
  Math.abs(a.outX - a.x) < 1e-9 && Math.abs(a.outY - a.y) < 1e-9 &&
  Math.abs(b.inX - b.x) < 1e-9 && Math.abs(b.inY - b.y) < 1e-9;

function subpathD(sp) {
  const n = sp.nodes;
  if (!n || n.length === 0) return '';
  if (n.length === 1) return `M ${rnd(n[0].x)} ${rnd(n[0].y)}`;
  let d = `M ${rnd(n[0].x)} ${rnd(n[0].y)}`;
  const L = sp.closed ? n.length : n.length - 1;
  for (let i = 0; i < L; i++) {
    const a = n[i], b = n[(i + 1) % n.length];
    if (isStraightSeg(a, b)) d += ` L ${rnd(b.x)} ${rnd(b.y)}`;
    else d += ` C ${rnd(a.outX)} ${rnd(a.outY)} ${rnd(b.inX)} ${rnd(b.inY)} ${rnd(b.x)} ${rnd(b.y)}`;
  }
  if (sp.closed) d += ' Z';
  return d;
}
function pathObjD(obj) {
  return (obj.subpaths || []).map(subpathD).filter(Boolean).join(' ');
}

/* --- 3次ベジェ評価 --- */
function cubicAt(p0, p1, p2, p3, t) {
  const mt = 1 - t, mt2 = mt * mt, t2 = t * t;
  return [
    mt2 * mt * p0[0] + 3 * mt2 * t * p1[0] + 3 * mt * t2 * p2[0] + t2 * t * p3[0],
    mt2 * mt * p0[1] + 3 * mt2 * t * p1[1] + 3 * mt * t2 * p2[1] + t2 * t * p3[1]
  ];
}
/* --- サブパスを折れ線に変換 --- */
function flattenSubpath(sp, steps = 16) {
  const n = sp.nodes, pts = [];
  if (!n || n.length === 0) return pts;
  if (n.length === 1) { pts.push([n[0].x, n[0].y]); return pts; }
  pts.push([n[0].x, n[0].y]);
  const L = sp.closed ? n.length : n.length - 1;
  for (let i = 0; i < L; i++) {
    const a = n[i], b = n[(i + 1) % n.length];
    if (isStraightSeg(a, b)) { pts.push([b.x, b.y]); continue; }
    const p0 = [a.x, a.y], p1 = [a.outX, a.outY], p2 = [b.inX, b.inY], p3 = [b.x, b.y];
    for (let s = 1; s <= steps; s++) pts.push(cubicAt(p0, p1, p2, p3, s / steps));
  }
  return pts;
}
function flattenPathObj(obj, steps = 16) {
  const out = [];
  for (const sp of (obj.subpaths || [])) {
    const pts = flattenSubpath(sp, steps);
    if (pts.length > 1) out.push({ pts, closed: !!sp.closed });
  }
  return out;
}

/* ============================ 2. SVGパス d パーサ ============================ */
function parsePathD(d) {
  const toks = String(d).match(/[a-zA-Z]|-?\d*\.?\d+(?:[eE][+-]?\d+)?/g);
  if (!toks) return [];
  const subs = [];
  let cur = null, i = 0;
  let cx = 0, cy = 0, sx = 0, sy = 0;
  let prevC = null, prevQ = null, cmd = null;
  const num = () => parseFloat(toks[i++]);
  const isCmd = (t) => /[a-zA-Z]/.test(t);

  function ensure() {
    if (!cur) { cur = { closed: false, nodes: [mkNode(cx, cy)] }; subs.push(cur); }
  }
  function last() { return cur.nodes[cur.nodes.length - 1]; }
  function push(x, y) { ensure(); cur.nodes.push(mkNode(x, y)); }

  while (i < toks.length) {
    if (isCmd(toks[i])) { cmd = toks[i]; i++; }
    else if (!cmd) { i++; continue; }
    else {
      // 暗黙の繰り返し（Mの後はL）
      if (cmd === 'M') cmd = 'L'; else if (cmd === 'm') cmd = 'l';
    }
    const rel = cmd === cmd.toLowerCase();
    const C = cmd.toUpperCase();
    if (C === 'M') {
      let x = num(), y = num();
      if (rel) { x += cx; y += cy; }
      cx = x; cy = y; sx = x; sy = y;
      cur = { closed: false, nodes: [mkNode(x, y)] };
      subs.push(cur);
      prevC = prevQ = null;
      cmd = rel ? 'l' : 'L';
    } else if (C === 'L') {
      let x = num(), y = num(); if (rel) { x += cx; y += cy; }
      push(x, y); cx = x; cy = y; prevC = prevQ = null;
    } else if (C === 'H') {
      let x = num(); if (rel) x += cx;
      push(x, cy); cx = x; prevC = prevQ = null;
    } else if (C === 'V') {
      let y = num(); if (rel) y += cy;
      push(cx, y); cy = y; prevC = prevQ = null;
    } else if (C === 'C') {
      let x1 = num(), y1 = num(), x2 = num(), y2 = num(), x = num(), y = num();
      if (rel) { x1 += cx; y1 += cy; x2 += cx; y2 += cy; x += cx; y += cy; }
      ensure();
      const a = last(); a.outX = x1; a.outY = y1;
      const b = mkNode(x, y); b.inX = x2; b.inY = y2;
      cur.nodes.push(b);
      cx = x; cy = y; prevC = [x2, y2]; prevQ = null;
    } else if (C === 'S') {
      let x2 = num(), y2 = num(), x = num(), y = num();
      if (rel) { x2 += cx; y2 += cy; x += cx; y += cy; }
      ensure();
      const a = last();
      let x1, y1;
      if (prevC) { x1 = 2 * cx - prevC[0]; y1 = 2 * cy - prevC[1]; }
      else { x1 = cx; y1 = cy; }
      a.outX = x1; a.outY = y1;
      const b = mkNode(x, y); b.inX = x2; b.inY = y2;
      cur.nodes.push(b);
      cx = x; cy = y; prevC = [x2, y2]; prevQ = null;
    } else if (C === 'Q' || C === 'T') {
      let qx, qy, x, y;
      if (C === 'Q') {
        qx = num(); qy = num(); x = num(); y = num();
        if (rel) { qx += cx; qy += cy; x += cx; y += cy; }
      } else {
        x = num(); y = num();
        if (rel) { x += cx; y += cy; }
        if (prevQ) { qx = 2 * cx - prevQ[0]; qy = 2 * cy - prevQ[1]; }
        else { qx = cx; qy = cy; }
      }
      ensure();
      const a = last();
      const c1x = a.x + 2 / 3 * (qx - a.x), c1y = a.y + 2 / 3 * (qy - a.y);
      const c2x = x + 2 / 3 * (qx - x), c2y = y + 2 / 3 * (qy - y);
      a.outX = c1x; a.outY = c1y;
      const b = mkNode(x, y); b.inX = c2x; b.inY = c2y;
      cur.nodes.push(b);
      cx = x; cy = y; prevQ = [qx, qy]; prevC = null;
    } else if (C === 'A') {
      const rx = num(), ry = num(), rot = num(), fa = num(), fs = num();
      let x = num(), y = num();
      if (rel) { x += cx; y += cy; }
      const segs = arcToCubics(cx, cy, rx, ry, rot, !!fa, !!fs, x, y);
      ensure();
      for (const s of segs) {
        const a = last(); a.outX = s[0]; a.outY = s[1];
        const b = mkNode(s[4], s[5]); b.inX = s[2]; b.inY = s[3];
        cur.nodes.push(b);
      }
      cx = x; cy = y; prevC = prevQ = null;
    } else if (C === 'Z') {
      if (cur) {
        cur.closed = true;
        const n = cur.nodes;
        if (n.length > 1) {
          const f0 = n[0], l0 = n[n.length - 1];
          if (Math.abs(f0.x - l0.x) < 1e-6 && Math.abs(f0.y - l0.y) < 1e-6) {
            f0.inX = l0.inX; f0.inY = l0.inY;
            n.pop();
          }
        }
        cx = sx; cy = sy;
      }
      cur = null; prevC = prevQ = null;
    } else { i++; }
  }
  // 直線ノードの t を corner に
  for (const sp of subs) for (const n of sp.nodes) n.t = 'corner';
  return subs;
}

function arcToCubics(x1, y1, rx, ry, phiDeg, fa, fs, x2, y2) {
  if (Math.abs(x1 - x2) < 1e-12 && Math.abs(y1 - y2) < 1e-12) return [];
  const phi = (phiDeg || 0) * Math.PI / 180;
  const cosP = Math.cos(phi), sinP = Math.sin(phi);
  const dx = (x1 - x2) / 2, dy = (y1 - y2) / 2;
  const x1p = cosP * dx + sinP * dy;
  const y1p = -sinP * dx + cosP * dy;
  rx = Math.abs(rx); ry = Math.abs(ry);
  if (rx < 1e-12 || ry < 1e-12) return [[x1, y1, x2, y2, x2, y2]];
  const lam = (x1p * x1p) / (rx * rx) + (y1p * y1p) / (ry * ry);
  if (lam > 1) { const s = Math.sqrt(lam); rx *= s; ry *= s; }
  const sign = (fa !== fs) ? 1 : -1;
  const numr = rx * rx * ry * ry - rx * rx * y1p * y1p - ry * ry * x1p * x1p;
  const den = rx * rx * y1p * y1p + ry * ry * x1p * x1p;
  const co = sign * Math.sqrt(Math.max(0, numr / den));
  const cxp = co * rx * y1p / ry;
  const cyp = -co * ry * x1p / rx;
  const cx = cosP * cxp - sinP * cyp + (x1 + x2) / 2;
  const cy = sinP * cxp + cosP * cyp + (y1 + y2) / 2;
  const ang = (ux, uy, vx, vy) => {
    const d = (ux * vx + uy * vy) / (Math.hypot(ux, uy) * Math.hypot(vx, vy));
    let a = Math.acos(clamp(d, -1, 1));
    if (ux * vy - uy * vx < 0) a = -a;
    return a;
  };
  const th1 = ang(1, 0, (x1p - cxp) / rx, (y1p - cyp) / ry);
  let dTh = ang((x1p - cxp) / rx, (y1p - cyp) / ry, (-x1p - cxp) / rx, (-y1p - cyp) / ry);
  if (!fs && dTh > 0) dTh -= 2 * Math.PI;
  if (fs && dTh < 0) dTh += 2 * Math.PI;
  const nseg = Math.max(1, Math.ceil(Math.abs(dTh / (Math.PI / 2))));
  const delta = dTh / nseg;
  const t = 4 / 3 * Math.tan(delta / 4);
  let th = th1, px = x1, py = y1;
  const out = [];
  for (let k = 0; k < nseg; k++) {
    const th2 = th + delta;
    const c1 = Math.cos(th), s1 = Math.sin(th);
    const c2 = Math.cos(th2), s2 = Math.sin(th2);
    const ex = cosP * rx * c2 - sinP * ry * s2 + cx;
    const ey = sinP * rx * c2 + cosP * ry * s2 + cy;
    const c1x = px + t * (-cosP * rx * s1 - sinP * ry * c1);
    const c1y = py + t * (-sinP * rx * s1 + cosP * ry * c1);
    const c2x = ex - t * (-cosP * rx * s2 - sinP * ry * c2);
    const c2y = ey - t * (-sinP * rx * s2 + cosP * ry * c2);
    out.push([c1x, c1y, c2x, c2y, ex, ey]);
    px = ex; py = ey; th = th2;
  }
  return out;
}

/* ============================ 3. 幾何アルゴリズム ============================ */
/* --- 点と折れ線の距離 --- */
function ptSegDist(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const l2 = dx * dx + dy * dy;
  if (l2 < 1e-12) return dist(px, py, x1, y1);
  let t = ((px - x1) * dx + (py - y1) * dy) / l2;
  t = clamp(t, 0, 1);
  return dist(px, py, x1 + t * dx, y1 + t * dy);
}

/* --- Ramer-Douglas-Peucker --- */
function rdp(points, eps) {
  if (points.length < 3) return points.slice();
  const keep = new Array(points.length).fill(false);
  keep[0] = keep[points.length - 1] = true;
  const stack = [[0, points.length - 1]];
  while (stack.length) {
    const [s, e] = stack.pop();
    let maxD = -1, idx = -1;
    for (let i = s + 1; i < e; i++) {
      const d = ptSegDist(points[i][0], points[i][1],
        points[s][0], points[s][1], points[e][0], points[e][1]);
      if (d > maxD) { maxD = d; idx = i; }
    }
    if (maxD > eps && idx > 0) {
      keep[idx] = true;
      stack.push([s, idx], [idx, e]);
    }
  }
  const out = [];
  for (let i = 0; i < points.length; i++) if (keep[i]) out.push(points[i]);
  return out;
}

/* --- 折れ線 → パス（角度でコーナー判定しつつ Catmull-Rom 的ハンドル付与） --- */
function polylineToSubpath(pts, closed, cornerCos = 0.55, tension = 1 / 3) {
  const n = pts.length;
  const nodes = [];
  if (n === 0) return { closed: false, nodes: [] };
  if (n === 1) return { closed: !!closed, nodes: [mkNode(pts[0][0], pts[0][1])] };
  if (n === 2) {
    const a = mkNode(pts[0][0], pts[0][1]);
    const b = mkNode(pts[1][0], pts[1][1]);
    return { closed: !!closed, nodes: [a, b] };
  }
  for (let i = 0; i < n; i++) {
    const p = pts[i];
    const hasPrev = closed || i > 0;
    const hasNext = closed || i < n - 1;
    const prev = pts[(i - 1 + n) % n];
    const next = pts[(i + 1) % n];
    let node = mkNode(p[0], p[1]);
    if (hasPrev && hasNext) {
      const v1x = p[0] - prev[0], v1y = p[1] - prev[1];
      const v2x = next[0] - p[0], v2y = next[1] - p[1];
      const l1 = Math.hypot(v1x, v1y) || 1, l2 = Math.hypot(v2x, v2y) || 1;
      const dot = (v1x * v2x + v1y * v2y) / (l1 * l2);
      if (dot < cornerCos) {
        node.t = 'corner';
      } else {
        const tx = (next[0] - prev[0]), ty = (next[1] - prev[1]);
        const tl = Math.hypot(tx, ty) || 1;
        const ux = tx / tl, uy = ty / tl;
        const hl1 = l1 * tension, hl2 = l2 * tension;
        node.inX = p[0] - ux * hl1; node.inY = p[1] - uy * hl1;
        node.outX = p[0] + ux * hl2; node.outY = p[1] + uy * hl2;
        node.t = 'smooth';
      }
    }
    nodes.push(node);
  }
  return { closed: !!closed, nodes };
}

/* --- 3次ベジェの最小二乗フィット（両端と接線方向を固定、長さα,βを解く） --- */
function fitCubic(P0, P3, T0, T1, samples) {
  const n = samples.length;
  if (n < 2) return null;
  // B(t) = base(t) + α*A(t) + β*Bc(t)
  let a11 = 0, a12 = 0, a22 = 0, b1 = 0, b2 = 0;
  const bx = P3[0] - P0[0], by = P3[1] - P0[1];
  for (const s of samples) {
    const t = s.t;
    const mt = 1 - t;
    const A = 3 * mt * mt * t;
    const B = 3 * mt * t * t;
    const Ax = A * T0[0], Ay = A * T0[1];
    const Bx = B * (-T1[0]), By = B * (-T1[1]);
    const basex = mt * mt * mt * P0[0] + 3 * mt * mt * t * P0[0]
      + 3 * mt * t * t * P3[0] + t * t * t * P3[0];
    // 実際は base(t) = P0*(1-t)^3 + P0*3(1-t)^2 t + P3*3(1-t)t^2 + P3*t^3
    const rx = s.x - basex;
    const basey = mt * mt * mt * P0[1] + 3 * mt * mt * t * P0[1]
      + 3 * mt * t * t * P3[1] + t * t * t * P3[1];
    const ry = s.y - basey;
    a11 += Ax * Ax + Ay * Ay;
    a12 += Ax * Bx + Ay * By;
    a22 += Bx * Bx + By * By;
    b1 += Ax * rx + Ay * ry;
    b2 += Bx * rx + By * ry;
  }
  const det = a11 * a22 - a12 * a12;
  if (Math.abs(det) < 1e-12) return null;
  let alpha = (b1 * a22 - b2 * a12) / det;
  let beta = (a11 * b2 - a12 * b1) / det;
  alpha = Math.max(0, alpha);
  beta = Math.max(0, beta);
  const c1 = [P0[0] + T0[0] * alpha, P0[1] + T0[1] * alpha];
  const c2 = [P3[0] - T1[0] * beta, P3[1] - T1[1] * beta];
  return [c1, c2];
}

/* --- オフセットパス（折れ線ベース、マイター/ラウンド） --- */
function offsetPolyline(pts, d, closed, join) {
  const n = pts.length;
  if (n < 2) return pts.slice();
  const segs = [];
  const L = closed ? n : n - 1;
  for (let i = 0; i < L; i++) {
    const a = pts[i], b = pts[(i + 1) % n];
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len * d, ny = dx / len * d;
    segs.push({ a: [a[0] + nx, a[1] + ny], b: [b[0] + nx, b[1] + ny], dir: [dx / len, dy / len] });
  }
  const out = [];
  const lineInt = (p1, p2, p3, p4) => {
    const d1x = p2[0] - p1[0], d1y = p2[1] - p1[1];
    const d2x = p4[0] - p3[0], d2y = p4[1] - p3[1];
    const den = d1x * d2y - d1y * d2x;
    if (Math.abs(den) < 1e-9) return null;
    const t = ((p3[0] - p1[0]) * d2y - (p3[1] - p1[1]) * d2x) / den;
    return [p1[0] + d1x * t, p1[1] + d1y * t];
  };
  const startI = closed ? 0 : 1;
  if (!closed) out.push(segs[0].a);
  for (let i = startI; i < (closed ? segs.length : segs.length - 1) + (closed ? 0 : 0); i++) {
    const s0 = segs[(i - 1 + segs.length) % segs.length];
    const s1 = segs[i % segs.length];
    if (!closed && i === 0) { out.push(s1.a); continue; }
    const p = lineInt(s0.a, s0.b, s1.a, s1.b);
    if (p && join === 'miter' && dist(p[0], p[1], s1.a[0], s1.a[1]) < Math.abs(d) * 6) {
      out.push(p);
    } else if (join === 'round') {
      const c = pts[closed ? i % n : i];
      const a0 = Math.atan2(s0.a[1] - c[1], s0.a[0] - c[0]);
      const a1 = Math.atan2(s1.a[1] - c[1], s1.a[0] - c[0]);
      let da = a1 - a0;
      while (da > Math.PI) da -= 2 * Math.PI;
      while (da < -Math.PI) da += 2 * Math.PI;
      const steps = Math.max(2, Math.ceil(Math.abs(da) / 0.4));
      for (let k = 0; k <= steps; k++) {
        const a = a0 + da * k / steps;
        out.push([c[0] + Math.cos(a) * Math.abs(d), c[1] + Math.sin(a) * Math.abs(d)]);
      }
    } else {
      out.push(s1.a);
    }
  }
  if (!closed) out.push(segs[segs.length - 1].b);
  return out;
}

/* ============================ 4. ブール演算（ポリゴン方式） ============================ */
function windingNumber(ring, px, py) {
  let wn = 0;
  for (let i = 0; i < ring.length; i++) {
    const a = ring[i], b = ring[(i + 1) % ring.length];
    if (a[1] <= py) {
      if (b[1] > py && ((b[0] - a[0]) * (py - a[1]) - (px - a[0]) * (b[1] - a[1])) > 0) wn++;
    } else {
      if (b[1] <= py && ((b[0] - a[0]) * (py - a[1]) - (px - a[0]) * (b[1] - a[1])) < 0) wn--;
    }
  }
  return wn;
}
function shapeInside(shape, px, py) {
  let w = 0;
  for (const r of shape) w += windingNumber(r, px, py);
  return w !== 0;
}
function segInt(p1, p2, p3, p4) {
  const d1x = p2[0] - p1[0], d1y = p2[1] - p1[1];
  const d2x = p4[0] - p3[0], d2y = p4[1] - p3[1];
  const den = d1x * d2y - d1y * d2x;
  if (Math.abs(den) < 1e-12) return null;
  const t = ((p3[0] - p1[0]) * d2y - (p3[1] - p1[1]) * d2x) / den;
  const u = ((p3[0] - p1[0]) * d1y - (p3[1] - p1[1]) * d1x) / den;
  if (t < -1e-9 || t > 1 + 1e-9 || u < -1e-9 || u > 1 + 1e-9) return null;
  return [t, u];
}
const keyOf = (p) => (Math.round(p[0] * 1e5) / 1e5) + ',' + (Math.round(p[1] * 1e5) / 1e5);

/**
 * 汎用ブール演算。shapes は「リングの配列」の配列。
 * op: 'union' | 'intersect' | 'subtract' | 'xor' | 'fragment'
 * 戻り値: [ { rings:[[x,y],...], sig:Set } ]
 */
function booleanRings(shapes, op) {
  const allEdges = [];
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (let si = 0; si < shapes.length; si++) {
    for (const ring of shapes[si]) {
      for (let i = 0; i < ring.length; i++) {
        const a = ring[i], b = ring[(i + 1) % ring.length];
        if (Math.abs(a[0] - b[0]) < 1e-12 && Math.abs(a[1] - b[1]) < 1e-12) continue;
        allEdges.push({ a, b, s: si, splits: [0, 1] });
        minX = Math.min(minX, a[0]); minY = Math.min(minY, a[1]);
        maxX = Math.max(maxX, a[0]); maxY = Math.max(maxY, a[1]);
      }
    }
  }
  if (!allEdges.length) return [];
  const diag = Math.hypot(maxX - minX, maxY - minY) || 1;
  const eps = diag * 1e-6;

  // 交差計算
  for (let i = 0; i < allEdges.length; i++) {
    for (let j = i + 1; j < allEdges.length; j++) {
      const e1 = allEdges[i], e2 = allEdges[j];
      const r = segInt(e1.a, e1.b, e2.a, e2.b);
      if (!r) continue;
      if (r[0] > 1e-7 && r[0] < 1 - 1e-7) e1.splits.push(r[0]);
      if (r[1] > 1e-7 && r[1] < 1 - 1e-7) e2.splits.push(r[1]);
    }
  }

  const insideAt = (pt) => {
    const ws = shapes.map(s => shapeInside(s, pt[0], pt[1]));
    if (op === 'union') return ws.some(w => w);
    if (op === 'intersect') return ws.every(w => w);
    if (op === 'subtract') return ws[0] && ws.slice(1).every(w => !w);
    if (op === 'xor') return (ws.filter(w => w).length % 2) === 1;
    return false;
  };
  const sigAt = (pt) => {
    let sig = '';
    for (let i = 0; i < shapes.length; i++) sig += shapeInside(shapes[i], pt[0], pt[1]) ? '1' : '0';
    return sig;
  };
  const isFragment = op === 'fragment';

  const kept = [];
  for (const e of allEdges) {
    const ts = Array.from(new Set(e.splits.map(t => Math.round(t * 1e7) / 1e7))).sort((a, b) => a - b);
    for (let k = 0; k < ts.length - 1; k++) {
      const t0 = ts[k], t1 = ts[k + 1];
      if (t1 - t0 < 1e-7) continue;
      const ax = e.a[0] + (e.b[0] - e.a[0]) * t0, ay = e.a[1] + (e.b[1] - e.a[1]) * t0;
      const bx = e.a[0] + (e.b[0] - e.a[0]) * t1, by = e.a[1] + (e.b[1] - e.a[1]) * t1;
      const mx = (ax + bx) / 2, my = (ay + by) / 2;
      let dx = bx - ax, dy = by - ay;
      const len = Math.hypot(dx, dy) || 1;
      dx /= len; dy /= len;
      const nx = -dy * eps * 4, ny = dx * eps * 4;
      const lx = mx + nx, ly = my + ny;
      const rx = mx - nx, ry = my - ny;

      if (isFragment) {
        const sl = sigAt([lx, ly]);
        const sr = sigAt([rx, ry]);
        if (sl === sr) continue;
        const insideLeft = (parseInt(sl, 2) >= 0) && sigAt([lx, ly]) !== '0'.repeat(shapes.length);
        const leftHas = sl.indexOf('1') >= 0;
        const rightHas = sr.indexOf('1') >= 0;
        if (!leftHas && !rightHas) continue;
        if (leftHas) kept.push({ a: [ax, ay], b: [bx, by], sig: sl, leftSig: sl, rightSig: sr });
        else kept.push({ a: [bx, by], b: [ax, ay], sig: sr, leftSig: sr, rightSig: sl });
      } else {
        const il = insideAt([lx, ly]);
        const ir = insideAt([rx, ry]);
        if (il === ir) continue;
        if (il) kept.push({ a: [ax, ay], b: [bx, by] });
        else kept.push({ a: [bx, by], b: [ax, ay] });
      }
    }
  }

  // 連結してループ化
  const map = new Map();
  kept.forEach((e, i) => {
    const k = keyOf(e.a);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(i);
  });
  const used = new Array(kept.length).fill(false);
  const loops = [];
  for (let i = 0; i < kept.length; i++) {
    if (used[i]) continue;
    const pts = [];
    let cur = i, guard = 0;
    let sig = kept[i].leftSig;
    while (cur !== undefined && !used[cur] && guard++ < kept.length + 5) {
      used[cur] = true;
      pts.push(kept[cur].a);
      const k = keyOf(kept[cur].b);
      const cands = map.get(k) || [];
      let next;
      for (const c of cands) { if (!used[c]) { next = c; break; } }
      cur = next;
    }
    if (pts.length >= 3) loops.push({ pts, sig: sig || '1' });
  }
  return loops;
}

/* --- オブジェクト検索 --- */
function findObj(id, list = state.doc.objects) {
  for (const o of list) {
    if (o.id === id) return o;
    if (o.type === 'group') { const r = findObj(id, o.children); if (r) return r; }
  }
  return null;
}
function findParentList(id, list = state.doc.objects, parent = null) {
  for (let i = 0; i < list.length; i++) {
    if (list[i].id === id) return { list, index: i, parent };
    if (list[i].type === 'group') {
      const r = findParentList(id, list[i].children, list[i]);
      if (r) return r;
    }
  }
  return null;
}
function topLevelObjects() { return state.doc.objects; }

function selectedObjects() {
  return state.sel.objs.map(id => findObj(id)).filter(Boolean);
}
/** 選択IDを「最上位の祖先」に正規化 */
function rootAncestorId(id) {
  let cur = id;
  for (let guard = 0; guard < 64; guard++) {
    const p = findParentList(cur);
    if (!p || !p.parent) return cur;
    cur = p.parent.id;
  }
  return cur;
}

/* --- バウンディングボックス --- */
function objBBox(obj) {
  if (!obj) return null;
  if (obj.type === 'group') {
    let bb = null;
    for (const c of obj.children) {
      const b = objBBox(c);
      if (!b) continue;
      bb = bb ? {
        x: Math.min(bb.x, b.x), y: Math.min(bb.y, b.y),
        w: Math.max(bb.x + bb.w, b.x + b.w) - Math.min(bb.x, b.x),
        h: Math.max(bb.y + bb.h, b.y + b.h) - Math.min(bb.y, b.y)
      } : b;
    }
    return bb;
  }
  if (obj.type === 'image') {
    if (!obj.rotation) return { x: obj.x, y: obj.y, w: obj.w, h: obj.h };
    const cx = obj.x + obj.w / 2, cy = obj.y + obj.h / 2;
    const a = obj.rotation * Math.PI / 180;
    const cos = Math.cos(a), sin = Math.sin(a);
    const corners = [[-obj.w / 2, -obj.h / 2], [obj.w / 2, -obj.h / 2], [obj.w / 2, obj.h / 2], [-obj.w / 2, obj.h / 2]]
      .map(([x, y]) => [cx + x * cos - y * sin, cy + x * sin + y * cos]);
    const xs = corners.map(c => c[0]), ys = corners.map(c => c[1]);
    return { x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys) };
  }
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity, any = false;
  for (const sp of (obj.subpaths || [])) {
    const pts = flattenSubpath(sp, 10);
    for (const p of pts) {
      any = true;
      if (p[0] < minX) minX = p[0];
      if (p[1] < minY) minY = p[1];
      if (p[0] > maxX) maxX = p[0];
      if (p[1] > maxY) maxY = p[1];
    }
  }
  if (!any) return null;
  return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
}
function objsBBox(objs) {
  let bb = null;
  for (const o of objs) {
    const b = objBBox(o);
    if (!b) continue;
    bb = bb ? {
      x: Math.min(bb.x, b.x), y: Math.min(bb.y, b.y),
      w: Math.max(bb.x + bb.w, b.x + b.w) - Math.min(bb.x, b.x),
      h: Math.max(bb.y + bb.h, b.y + b.h) - Math.min(bb.y, b.y)
    } : b;
  }

}
function docBBox() {
  const bb = objsBBox(state.doc.objects);
  return bb || { x: 0, y: 0, w: 800, h: 600 };
}

/* --- 変形操作 --- */
function translateObj(obj, dx, dy) {
  if (obj.type === 'group') { obj.children.forEach(c => translateObj(c, dx, dy)); return; }
  if (obj.type === 'image') { obj.x += dx; obj.y += dy; return; }
  for (const sp of obj.subpaths) for (const n of sp.nodes) {
    n.x += dx; n.y += dy; n.inX += dx; n.inY += dy; n.outX += dx; n.outY += dy;
  }
}
function scaleObj(obj, cx, cy, sx, sy) {
  const f = (x, y) => [cx + (x - cx) * sx, cy + (y - cy) * sy];
  if (obj.type === 'group') { obj.children.forEach(c => scaleObj(c, cx, cy, sx, sy)); return; }
  if (obj.type === 'image') {
    const p = f(obj.x, obj.y);
    obj.x = p[0]; obj.y = p[1];
    obj.w *= Math.abs(sx); obj.h *= Math.abs(sy);
    return;
  }
  for (const sp of obj.subpaths) for (const n of sp.nodes) {
    let p;
    p = f(n.x, n.y); n.x = p[0]; n.y = p[1];
    p = f(n.inX, n.inY); n.inX = p[0]; n.inY = p[1];
    p = f(n.outX, n.outY); n.outX = p[0]; n.outY = p[1];
  }

function rotateObj(obj, cx, cy, deg) {
  const a = deg * Math.PI / 180, cos = Math.cos(a), sin = Math.sin(a);
  const f = (x, y) => {
    const dx = x - cx, dy = y - cy;
    return [cx + dx * cos - dy * sin, cy + dx * sin + dy * cos];
  };
  if (obj.type === 'group') { obj.children.forEach(c => rotateObj(c, cx, cy, deg)); return; }
  if (obj.type === 'image') {
    const ccx = obj.x + obj.w / 2, ccy = obj.y + obj.h / 2;
    const p = f(ccx, ccy);
    obj.x = p[0] - obj.w / 2; obj.y = p[1] - obj.h / 2;
    obj.rotation = (obj.rotation || 0) + deg;
    return;
  }
  for (const sp of obj.subpaths) for (const n of sp.nodes) {
    let p;
    p = f(n.x, n.y); n.x = p[0]; n.y = p[1];
    p = f(n.inX, n.inY); n.inX = p[0]; n.inY = p[1];
    p = f(n.outX, n.outY); n.outX = p[0]; n.outY = p[1];
  }
}
function setObjBBox(obj, nx, ny, nw, nh) {
  const b = objBBox(obj);
  if (!b) return;
  const sx = b.w > 1e-9 ? nw / b.w : 1;
  const sy = b.h > 1e-9 ? nh / b.h : 1;
  scaleObj(obj, b.x, b.y, sx, sy);
  const nb = objBBox(obj);
  translateObj(obj, nx - nb.x, ny - nb.y);
}

/* ============================ 6. レンダリング ============================ */
const svgEl = $('#svg');
const sceneRoot = $('#sceneRoot');
const overlayRoot = $('#overlayRoot');
const elMap = new Map();

function applyView() {
  const v = state.doc.view;
  const tf = `translate(${v.tx} ${v.ty}) scale(${v.scale})`;
  sceneRoot.setAttribute('transform', tf);
  overlayRoot.setAttribute('transform', tf);
  $('#gridPat').setAttribute('width', state.doc.settings.gridSize);
  $('#gridPat').setAttribute('height', state.doc.settings.gridSize);
  $('#gridPat').firstElementChild.setAttribute('d',

  $('#stZoom').textContent = Math.round(v.scale * 100) + '%';

function buildObjEl(obj, keep) {
  if (obj.visible === false) return null;
  const want = obj.type === 'image' ? 'image' : (obj.type === 'group' ? 'g' : 'path');
  let el = elMap.get(obj.id);
  if (!el || el.tagName.toLowerCase() !== want) {
    if (el) el.remove();
    el = document.createElementNS(NS, want);
    elMap.set(obj.id, el);
  }
  keep.add(obj.id);
  el.setAttribute('data-id', obj.id);

  if (obj.type === 'path') {
    el.setAttribute('d', pathObjD(obj));
    el.setAttribute('fill', obj.fill && obj.fill !== 'none' ? obj.fill : 'none');
    if (obj.fillRule) el.setAttribute('fill-rule', obj.fillRule);
    el.setAttribute('stroke', obj.stroke && obj.stroke !== 'none' ? obj.stroke : 'none');
    el.setAttribute('stroke-width', obj.strokeWidth != null ? obj.strokeWidth : 1);
    el.setAttribute('stroke-linejoin', obj.strokeLinejoin || 'miter');
    el.setAttribute('stroke-linecap', obj.strokeLinecap || 'butt');
    if (obj.opacity != null && obj.opacity !== 1) el.setAttribute('opacity', obj.opacity);
    else el.removeAttribute('opacity');
  } else if (obj.type === 'image') {
    el.setAttributeNS('http://www.w3.org/1999/xlink', 'href', obj.href);
    el.setAttribute('href', obj.href);
    el.setAttribute('x', obj.x); el.setAttribute('y', obj.y);
    el.setAttribute('width', obj.w); el.setAttribute('height', obj.h);
    el.setAttribute('preserveAspectRatio', 'none');
    if (obj.rotation) {
      el.setAttribute('transform', `rotate(${obj.rotation} ${obj.x + obj.w / 2} ${obj.y + obj.h / 2})`);
    } else el.removeAttribute('transform');
    el.setAttribute('opacity', obj.opacity != null ? obj.opacity : 1);
  } else if (obj.type === 'group') {
    el.style.opacity = obj.opacity != null ? obj.opacity : 1;
    const childKeep = new Set();
    for (const c of obj.children) {
      const ce = buildObjEl(c, childKeep);
      if (ce) el.appendChild(ce);
    }
    for (const ch of Array.from(el.children)) {
      const id = ch.getAttribute('data-id');
      if (!id || !childKeep.has(id)) ch.remove();
    }
  }
  el.style.pointerEvents = obj.locked ? 'none' : 'auto';
  return el;
}

function renderScene() {
  const keep = new Set();
  for (const obj of state.doc.objects) {
    const el = buildObjEl(obj, keep);
    if (el) sceneRoot.appendChild(el);
  }
  for (const [id, el] of Array.from(elMap)) {
    if (!keep.has(id)) { el.remove(); elMap.delete(id); }
  }
  applyView();
}

/** 単一オブジェクトのジオメトリだけ高速更新（ドラッグ中） */
function refreshObjGeometry(obj) {
  const el = elMap.get(obj.id);
  if (!el) return;
  if (obj.type === 'path') el.setAttribute('d', pathObjD(obj));
  else if (obj.type === 'image') {
    el.setAttribute('x', obj.x); el.setAttribute('y', obj.y);
    el.setAttribute('width', obj.w); el.setAttribute('height', obj.h);
  } else if (obj.type === 'group') obj.children.forEach(refreshObjGeometry);
}

/* ---------- オーバーレイ ---------- */
let overlayCache = {};
function renderOverlay() {
  const frag = document.createDocumentFragment();
  const st = state.doc.settings;

  // ガイド
  if (st.guidesVisible) {
